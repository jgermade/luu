<script :setup>
  // The workspace tree. Lazy per directory, because a repository with a
  // `target/` in it is not one to walk eagerly, and because the endpoint is
  // one directory wide for the same reason. See
  // `RECORD/2026-09-15.a-three-pane-inspector.WIP.md`.
  const { workspace, openDir, toggleDir, refresh, showFile, loadStatus, loadIcons, iconFor } =
    await import("./workspace.js")

  // Rooted at the folder somebody chose, which is a subdirectory of the one
  // `luu serve` was started in. Paths stay relative to *that* base throughout —
  // the root decides where the tree starts, not how a file is addressed. See
  // `RECORD/2026-09-16.three-columns-that-each-have-a-footer.completed.md`.
  openDir(workspace.root || "")
  loadStatus()
  loadIcons()

  // The tree, flattened to what is actually on screen: one pass that walks
  // only the directories that are expanded, carrying a depth for the indent.
  // A recursive component would need one instance per node to say the same
  // thing.
  const flatten = (path, depth, out) => {
    for (const entry of workspace.open[path] || []) {
      // The icon id is resolved in the pass rather than in the template, where
      // it took two calls per row — one for the `:if`, one for the `src`. A
      // `null` here is what selects the page's own shape, and it means *this
      // row has no theme icon*, which is not the same question as *is a theme
      // loaded*: a theme that declares no `file` default answers null too.
      const open = !!entry.dir && !!workspace.expanded[entry.path]
      out.push({ ...entry, depth, open, icon: iconFor(entry.name, entry.dir, open) })
      if (entry.dir && workspace.expanded[entry.path]) {
        flatten(entry.path, depth + 1, out)
      }
    }
    return out
  }
  // `workspace.icons` is in the list because the manifest arrives after the
  // first listing does — without it the tree would keep the shapes it resolved
  // in the moment before the theme loaded.
  $: rows = (workspace.open, workspace.expanded, workspace.icons,
             flatten(workspace.root || "", 0, []))

  $: selectedPath = workspace.selected?.kind === "file" ? workspace.selected.path : null
</script>

<div class="head">
  <h2>Files</h2>
  <button type="button" class="link" @click="refresh()" title="Re-read the tree and git">
    <svg class="ic"><use href="#i-refresh"/></svg>
  </button>
</div>

<p :if="workspace.error" class="err">{{ workspace.error }}</p>

<ul class="tree">
  <li :each="row in rows" :key="row.path">
    <button
      type="button"
      class="row"
      :class.on="row.path === selectedPath"
      :class.ignored="row.ignored"
      :attrs="{ style: `padding-left:${row.depth * 0.75 + 0.2}rem`, title: row.path }"
      @click="row.dir ? toggleDir(row.path) : showFile(row.path)">
      <span class="twist">
        <svg :if="row.dir" class="ic" :class.open="row.open"><use href="#i-caret"/></svg>
      </span>
      <!-- The theme's own art where the theme has some, and this page's two
           shapes where it has none. Never both — and the condition is the row's
           own icon rather than `icons.loaded`, or a theme that declares no
           default would leave the row with neither and lose its 16px box. -->
      <img
        :if="row.icon"
        class="icon"
        :src="`./api/icons/${row.icon}`"
        :attrs="{ alt: '', loading: 'lazy' }">
      <svg :if="!row.icon" class="ic glyph"><use :attrs="{ href: row.dir ? '#i-folder' : '#i-file' }"/></svg>
      <span class="name">{{ row.name }}</span>
      <!-- Git's own letter, not a word: `M`, `??`, `A` are what `git status`
           says, and a person reading this panel already knows them. -->
      <span :if="row.status" class="status" :class="row.status.trim()">{{ row.status }}</span>
    </button>
  </li>
</ul>

<p :if="!rows.length && !workspace.error" class="dim">Reading the workspace…</p>

  .twist { width: 14px; flex: none; display: flex; justify-content: center; color: var(--dim); }

  /* The fallback, and still deliberately not a second icon set: two shapes,

  .glyph { color: var(--dim); }

  .row.on .twist { color: var(--on-accent); }

  .row.on .status { color: var(--on-accent); }
