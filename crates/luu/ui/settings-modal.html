<script :setup>
  // Settings, as sections down the side rather than as one scroll.
  //
  // The shape every operating system's settings window has converged on, for
  // the reason that the sections are **not steps**: a theme and a provider
  // table have nothing to do with each other, and stacking them made the second
  // one the reward for scrolling past the first. See
  // `RECORD/2026-09-16.three-columns-that-each-have-a-footer.completed.md`.
  const { state, closeSettings } = await import("./store.js")
  const { ui, showSection } = await import("./ui.js")
  const { asModal } = await import("./modal.js")

  // ESC, the focus trap and the backdrop come from `<dialog>` rather than from
  // this file. See `modal.js`.
  asModal("settings-dialog", { close: closeSettings })

  const SettingsGeneral = await import("./settings-general.html")
  const SettingsModels = await import("./settings-models.html")
  const SettingsResend = await import("./settings-resend.html")
</script>

<!-- `@click.self` is the backdrop: a click that lands on the dialog itself
     rather than on anything inside it is a click outside the box, because the
     dialog has no padding of its own for a click to land in. -->
<dialog id="settings-dialog" class="modal wide" @click.self="closeSettings()">
  <header class="modal-head">
    <strong>Settings</strong>
    <button type="button" class="link" @click="closeSettings()">close</button>
  </header>

  <div class="sections">
    <!-- The rail. The third section is the one the shape was said to make
         free, and it was: a name and a component, no place in a scroll. It is
         here rather than in General because General is facts about the
         *screen* — a theme, a layout, which editor draws a file, all in
         `localStorage` — and these three change the bytes a run sends. A
         preference that changes the prompt is not a preference. See
         `RECORD/2026-09-18.the-window-rules-are-a-session-fact.WIP.md`. -->
    <nav class="rail">
      <button
        type="button"
        :class.on="ui.section === 'general'"
        @click="showSection('general')">
        <svg class="ic"><use href="#i-sliders"/></svg>
        <span>General</span>
      </button>
      <button
        type="button"
        :class.on="ui.section === 'models'"
        @click="showSection('models')">
        <svg class="ic"><use href="#i-server"/></svg>
        <span>Models</span>
      </button>
      <button
        type="button"
        :class.on="ui.section === 'resend'"
        @click="showSection('resend')">
        <svg class="ic"><use href="#i-repeat"/></svg>
        <span>Resend</span>
      </button>
    </nav>

    <section class="modal-body pane">
      <SettingsGeneral :if="ui.section === 'general'" />
      <SettingsModels :if="ui.section === 'models'" />
      <SettingsResend :if="ui.section === 'resend'" />
    </section>
  </div>
</dialog>
