[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tokenizers.workspace = true
toml.workspace = true

# `net` is for the tests only: `tests/ollama_wire.rs` binds a stub HTTP server
# to read what the backend actually sends. Nothing in the library listens.
[dev-dependencies]
tokio = { workspace = true, features = ["net"] }

# Level 2 of the sandbox ladder: the kernel holding a subprocess. Linux-only and
# gated so that `cargo build` on macOS pulls none of it — the fallback there
# reports what is missing rather than failing to compile.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true
