name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise.
        type: choice
        options: [patch, minor, major]
        default: patch
      dry-run:
        description: Build and bump nothing — just check the release would work.
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Raise the version
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          IFS=. read -r major minor patch <<< "$current"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "$current → $next"

          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::v$next already exists"
            exit 1
          fi

          sed -i "0,/^version = \".*\"/s//version = \"$next\"/" Cargo.toml
          # Refreshes the workspace members' versions in the lockfile without
          # compiling, and without touching any other dependency.
          cargo metadata --format-version 1 --offline >/dev/null 2>&1 || cargo metadata --format-version 1 >/dev/null

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "dry run: leaving the bump uncommitted"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release v$next"
          git tag -a "v$next" -m "v$next"
          git push origin HEAD --follow-tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      # The version bump is a new commit, so the build must be told to use it —
      # a reusable workflow otherwise checks out the caller's ref.
      ref: ${{ needs.version.outputs.sha }}
      pages: true

  publish:
    needs: [version, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: luu-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # What `pages/setup.sh` checks a download against before it
          # installs it.
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS

  # The images and the chart, from the release just published: both images
  # take its Linux binaries rather than compiling them again, so they cannot
  # come before it. See RECORD/2026-10-30.three-ways-in.WIP.md.
  images:
    needs: [version, publish]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: luu serve — ghcr.io/jgermade/luu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile.release
          platforms: linux/amd64,linux/arm64
          build-args: LUU_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ghcr.io/jgermade/luu:${{ env.VERSION }}
            ghcr.io/jgermade/luu:latest

      - name: the worker — ghcr.io/jgermade/luu-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.release
          platforms: linux/amd64,linux/arm64
          build-args: LUU_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ghcr.io/jgermade/luu-worker:${{ env.VERSION }}
            ghcr.io/jgermade/luu-worker:latest

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: The chart — oci://ghcr.io/jgermade/charts/luu
        run: |
          set -euo pipefail
          helm package deploy/helm/luu --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "luu-$VERSION.tgz" oci://ghcr.io/jgermade/charts

  pages:
    needs: [version, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
