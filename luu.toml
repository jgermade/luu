# Loude's own sandbox, for running the agent on this repository.
#
# The whole policy is here: an allowlist of trees and an allowlist of programs.
# There is no deny list, deliberately — Landlock is allow-only, so a subtraction
# could be honoured in our own checks and not in a subprocess, which is where it
# would matter. The way to deny is to not grant. See
# RECORD/2026-08-27.tools-and-sandbox.completed.md.
#
# `luu tools` prints the resolved result, the implicit grants included.

[sandbox]
# Subprocesses run only if the kernel takes the Landlock ruleset and the seccomp
# filter. Where it cannot — macOS, a kernel without Landlock — `run_command` is
# denied and says what is missing. Lower it to "best-effort" deliberately, per
# run, and every verdict then carries the gap.
enforcement = "kernel"

# Off, so a build script cannot phone home. Turning it on is one word, and every
# verdict for the session says so.
network = false

# Program names, never shell strings: `sh -c "cargo test; curl …"` would pass
# any check that looks at the first word.
commands = ["cargo", "rustc", "git", "rg", "ls"]

# What a child may spend, as opposed to what it may reach. `setrlimit` is POSIX,
# so this is the one rung that holds a subprocess on macOS too — where there is
# no Landlock and no seccomp, and where the verdict used to say "in-process check
# only". Every number here is applied soft and hard together in the child, except
# cpu-seconds, whose hard limit is one second higher: RLIMIT_CPU sends SIGXCPU at
# the soft limit and SIGKILL at the hard one, and equal limits lose the signal
# that says which limit killed the child.
#
# The two that are commented out are off by default, and turning them on is a
# per-machine decision rather than a safer default:
#
#   memory-mb  is RLIMIT_AS, and a Rust toolchain *reserves* address space far
#              above what it commits — a number that looks like "what a build
#              needs" kills builds that were fine.
#   processes  is RLIMIT_NPROC, which the kernel counts per real uid and not per
#              process tree: every process you are already running counts against
#              it. The right answer for a fork bomb is a pids cgroup, and that
#              arrives with the container.
[sandbox.limits]
cpu-seconds = 300     # per process, and a second belt to run_command's 30s clock
file-size-mb = 1024   # per file: one file growing without bound is a disk bomb
# memory-mb = 4096
# processes = 512

[[sandbox.paths]]
path = "."
access = "read-write"

# Nothing outside the repository is granted, and a granted path that is not there
# is a load error rather than a rule that silently does nothing — so the toolchain
# directories are not listed here: they are not in the same place on every machine
# that clones this. `cargo` will fail to read its registry until you add them, and
# adding them is the point:
#
#   [[sandbox.paths]]
#   path = "~/.cargo"
#   access = "execute"
#
#   [[sandbox.paths]]
#   path = "~/.rustup"
#   access = "execute"
#
# One informed line beats a prompt per call, which is what trains people to click
# yes without reading.

# Who may approve a job, and whether anyone must prove it.
#
# `approve_job` is the authority this design is built around — nothing runs
# behind the gate until it arrives — and off loopback the bearer token only
# answers *who may reach the port*, never *who approved*. A signature answers
# the second question with a key no relay holds. Off here, because a loopback
# session with a person at the keyboard is what every measurement in this
# repository was made under. See RECORD/2026-09-04.signed-approvals.completed.md.
#
#   [approvals]
#   required = true
#
#   [[approvals.key]]
#   name = "jgermade"
#   public = "ed25519:…"        # `luu key new --out ~/.loude/approval.key`
#
# A *wrong* signature is refused whether or not one is required: `required`
# decides what an absent signature means and nothing else.
