apiVersion: v1
kind: Service
metadata:
  name: {{ include "luu.fullname" . }}
  labels:
    {{- include "luu.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "luu.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
