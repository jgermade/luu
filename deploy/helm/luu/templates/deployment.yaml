apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "luu.fullname" . }}
  labels:
    {{- include "luu.labels" . | nindent 4 }}
spec:
  # One: `serve` runs one live session, and its state volume is ReadWriteOnce.
  # Recreate, so an upgrade never has two pods on one volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "luu.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "luu.selector" . | nindent 8 }}
        # What a worker pod's affinity finds this one by.
        app.kubernetes.io/component: server
    spec:
      {{- if include "luu.pods" . }}
      # kubectl's, for a pod per session: see rbac.yaml.
      serviceAccountName: {{ include "luu.fullname" . }}
      automountServiceAccountToken: true
      {{- else }}
      # Nothing here talks to the cluster.
      automountServiceAccountToken: false
      {{- end }}
      # The image's `luu` user, and the volumes made its own.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        # A recursive relabel would give auth.db g+rw, and luu refuses that.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: luu
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if include "luu.pods" . }}
          # Every session's worker a pod: `luu serve --worker kubernetes`.
          args:
            - --worker
            - kubernetes
            - --worker-image
            - "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          env:
            {{- with include "luu.origin" . }}
            - name: LUU_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            {{- if include "luu.pods" . }}
            # What a worker pod needs that luu's own pod knows. See
            # RECORD/2026-11-03.a-pod-per-session.WIP.md.
            - name: LUU_KUBE_CLAIM
              value: {{ include "luu.workClaim" . | quote }}
            - name: LUU_KUBE_CLAIM_ROOT
              value: /work
            - name: LUU_KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LUU_KUBE_OWNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LUU_KUBE_OWNER_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: LUU_KUBE_LABELS
              value: {{ include "luu.workerLabels" . | quote }}
            {{- if .Values.worker.sameNode }}
            - name: LUU_KUBE_SAME_NODE
              value: "app.kubernetes.io/name={{ .Chart.Name }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=server"
            {{- end }}
            {{- with .Values.worker.runtimeClassName }}
            - name: LUU_KUBE_RUNTIME_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.resources }}
            - name: LUU_KUBE_RESOURCES
              value: {{ toJson . | quote }}
            {{- end }}
            - name: LUU_KUBE_PULL_POLICY
              value: {{ .Values.worker.image.pullPolicy | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7878
            {{- if .Values.links.enabled }}
            - name: ssh
              containerPort: {{ .Values.links.port }}
            {{- end }}
          # The container is the sandbox: nothing it does not need.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: state
              mountPath: /state
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            {{- if .Values.mail.passwordSecret }}
            # Under /run, which no session's command is granted: not /etc.
            - name: smtp-password
              mountPath: /run/secrets/luu
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.state.existingClaim | default (printf "%s-state" (include "luu.fullname" .)) }}
        - name: work
          persistentVolumeClaim:
            claimName: {{ include "luu.workClaim" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.mail.passwordSecret }}
        - name: smtp-password
          secret:
            secretName: {{ .Values.mail.passwordSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.mail.passwordKey }}
                path: smtp-password
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
