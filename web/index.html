<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>luu — debug</title>
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<!-- The theme first: its tokens, then its answer for luu's own surfaces.
     `app.css` declares no value of its own. -->
<link rel="stylesheet" href="./theme/default/tokens.css">
<link rel="stylesheet" href="./theme/default/luu.css">
<link rel="stylesheet" href="./app.css">
<!-- Asked for beside the modules below rather than after them: the one
     question the page asks before anything else, and the page its answer
     picks unless this server has users and nobody is logged in. `whoAmI`'s
     fetch and jq79's take these responses instead of asking again — the same
     URL, `as="fetch"` and `crossorigin` being what a plain `fetch()` is. Two
     round trips fewer before the first paint. On the login view `app.html`
     goes unused, and Chrome warns that it was; the page reloads into the app
     once logged in. See
     RECORD/2026-11-05.what-the-first-load-waits-on.completed.md. -->
<link rel="preload" href="./api/auth/me.json" as="fetch" crossorigin>
<link rel="preload" href="./app.html" as="fetch" crossorigin>
</head>
<body>
<main id="app"></main>
<!-- Until `#app` has an element in it: `app.css` hides it then. -->
<div class="boot" role="status" aria-label="Loading luu">
  <svg viewBox="0 0 512 512" aria-hidden="true">
    <rect width="512" height="512" fill="#12161c" rx="112"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="40">
      <path class="boot-l" stroke="#f5a524" pathLength="1" d="M116 150v210"/>
      <path class="boot-u" stroke="#f2f4f7" pathLength="1" d="M196 215v105a40 40 0 0 0 80 0V215M316 215v105a40 40 0 0 0 80 0V215"/>
    </g>
    <circle class="boot-dot" cx="356" cy="296" r="13" fill="#f5a524"/>
  </svg>
</div>
<!-- `@web/` is this folder, from wherever the importing file sits — so no
     import climbs with `../`. Before the first module script, which is the
     only place an import map is honoured. -->
<script type="importmap">{ "imports": { "@web/": "./" } }</script>
<script type="module">
  // Before jq79, which fetches a component each time a setup imports it.
  import "./lib/components-once.js"
  import { C79 } from "./vendor/jq79.js"
  import { whoAmI } from "./lib/account.js"
  // On a server with users nothing loads before a login: every request the
  // app makes would be a 401. Everywhere else the answer is `users: false`.
  const account = await whoAmI()
  // No owner yet is setup, which takes the one-time link `luu config
  // setup-url` prints. See RECORD/2026-11-03.an-owner-proved-by-email.WIP.md.
  const page = !account.users || account.loggedIn ? "./app.html"
    : account.owner ? "./views/login/login.html"
    : "./views/login/setup.html"
  C79.fetch(page).mount("#app")
</script>
</body>
</html>
