<script :setup="{ name = '', title = '', summary = '' }">
  // One of the debug panel's cards: a title that folds it, the card in one
  // phrase while it is folded, and the body while it is not.
  //
  //   <Card name="context" title="Context" :summary="`${used}% used`">
  //     <template :slot.action><button …>open →</button></template>
  //     …
  //   </Card>
  //
  // `name` is what the fold is remembered under (`prefs.debugFolded`), so a
  // person who folded the prompt finds it folded after a reload. `summary` is
  // drawn only while folded: an open card says it in its body, with the
  // numbers. `action` is a control on the head's far side that is not the
  // fold — the prompt's *open →* — and stays there folded or not.
  const { prefs, toggleDebugCard } = await import("@web/lib/prefs.js")

  $: open = !prefs.debugFolded.includes(name)
</script>

<section class="card" :class.folded="!open">
  <header class="card-head">
    <h2>
      <button type="button" class="fold" :aria-expanded="open ? 'true' : 'false'"
              @click="toggleDebugCard(name)">
        <span class="title">{{ title }}</span>
        <svg class="ic caret" :class.open="open"><use href="#i-caret"/></svg>
        <span :if="!open && summary" class="summary">{{ summary }}</span>
      </button>
    </h2>
    <slot.action />
  </header>
  <div :if="open" class="card-body"><slot /></div>
</section>
