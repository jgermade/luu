<script :setup="{ close = null }">
  // Where the live session's commands run, and the way to move them: every
  // place a page may choose (`lib/places.js` — the server's own policy file,
  // each `[posture.<name>]` and `[environment.<name>]`, a contained one on
  // every container runtime), each with its runtime's mark. Opened from the
  // content column's foot. See
  // `RECORD/2026-10-27.the-runtime-is-moved-in-a-dialog.completed.md`.
  //
  // **A move is confirmed, by what it leaves behind.** The folder is the same
  // in every place — mounted at its own path in a container — and nothing else
  // is: what the model installed where the session runs now does not come
  // along, and a container the session leaves goes with everything in it. The
  // box says that about the two places chosen, and *Move* waits for it.
  const { terminal, moveSession } = await import("@web/lib/terminal.js")
  const { state } = await import("@web/lib/store.js")
  const Modal = await import("@web/theme/default/components/modal.html")
  const Button = await import("@web/theme/default/components/button.html")
  const Checkbox = await import("@web/theme/default/components/checkbox.html")
  const BrandIcon = await import("@web/components/brand-icon.html")
  const { placeOptions, livePlace, placeMark } = await import("@web/lib/places.js")
  const { loadBrands } = await import("@web/lib/brands.js")
  loadBrands()

  // False once it should leave: `Modal` plays the exit, then `close`
  // unmounts it.
  let open = true
  const leave = () => {
    open = false
    const ms = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--luu-duration"))
    setTimeout(() => close?.(), Number.isFinite(ms) ? ms : 0)
  }

  $: places = placeOptions(state.postures)
  $: here = livePlace(state.postures, terminal.info?.posture)
  $: now = places.find(p => p.value === here)
  let chosen = ""
  let understood = false
  $: target = places.find(p => p.value === (chosen || here))
  $: moving = !!chosen && chosen !== here
  const contained = place => !!place?.where && place.where !== "host" && place.where !== "direct"

  // What it leaves behind, about these two places, in the box's own words.
  $: behind = !moving ? ""
    : contained(now)
      ? `Its container goes with the move: what the model installed in ${now.label} — packages, tools, anything outside this folder — is gone, and is not in ${target.label}.`
      : `What the model installed on this machine is not in ${target.label}${contained(target) ? ", which starts from its image" : ""}.`
  // And the rest of what a move does, which needs no ticking.
  $: also = !moving ? ""
    : [
        "The model's next command runs there, and the terminal opens again there — the shell open now ends.",
        contained(target)
          ? "In the container only this folder is there, at its own path, with the image's tools and no network a list does not allow."
          : "On this machine it runs as you: your tools and your files, and its terminal is your whole account.",
      ].join(" ")

  const pick = place => {
    if (place.disabled || terminal.moving) return
    chosen = place.value
    understood = false
  }

  const move = async () => {
    if (!moving || !understood || terminal.moving) return
    const [name, runtime] = target.value.split("|")
    await moveSession(name, runtime || null, document.querySelector(".content .terminal .host"))
    if (!terminal.moveError) leave()
  }
</script>

<!-- Hung from the top: the box that appears under the places once one is
     chosen grows the dialog downward, and the places stay where they were. -->
<Modal :open="open" title="Runtime" width="34rem" align="top" @close="leave()">
  <p class="lead dim">Where this session's commands run: the model's, and the terminal's.</p>

  <div class="places" role="radiogroup" aria-label="Runtime">
    <button :each="place in places" :key="place.value" type="button" role="radio" class="place"
            :aria-checked="String(place.value === (chosen || here))"
            :class.on="place.value === (chosen || here)"
            :disabled="place.disabled || terminal.moving"
            :title="place.title"
            @click="pick(place)">
      <span class="mark">
        <BrandIcon :if="placeMark(place.where).src" :src="placeMark(place.where).src" size="18px" />
        <svg :if="!placeMark(place.where).src" class="ic"><use :href="placeMark(place.where).glyph"/></svg>
      </span>
      <span class="text">
        <span class="label">{{ place.label }}<span :if="place.value === here" class="tag">now</span></span>
        <span class="hint">{{ place.title }}</span>
      </span>
    </button>
  </div>

  <div :if="moving" class="implications">
    <Checkbox :model="understood" @change="understood = $event.detail"
              label="Leave behind what the model installed" :description="behind" />
    <p class="dim small">{{ also }}</p>
  </div>
  <p :if="terminal.moveError" class="error small">{{ terminal.moveError }}</p>

  <template :slot.foot>
    <Button variant="ghost" @click="leave()">Cancel</Button>
    <Button variant="primary" :disabled="!moving || !understood || terminal.moving" :loading="terminal.moving"
            @click="move()">{{ terminal.moving ? "Moving…" : "Move the session" }}</Button>
  </template>
</Modal>
