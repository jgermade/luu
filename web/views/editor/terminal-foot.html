<script :setup>
  // Where the session's commands run, in the content column's foot whether
  // the terminal is up or put away — that is true either way: the column has
  // one foot, under the terminal, rather than a foot for the file and a
  // second one for the shell. The foot's own button is what shows and hides
  // the panel. See `RECORD/2026-10-01.the-terminal-follows-the-session.completed.md`.
  //
  // **Named *Runtime*, and moved through a dialog.** The place is the
  // session's, not only the terminal's — the model's next command runs there
  // too — and a move leaves behind whatever the model installed where it ran,
  // which a dropup had no room to say. The button shows where it runs now, by
  // its mark and its name; the dialog (`runtime-dialog.html`, mounted at the
  // page's root so it takes the page's tone) chooses another. See
  // `RECORD/2026-10-27.the-runtime-is-moved-in-a-dialog.completed.md`.
  const { terminal, restartTerminal } = await import("@web/lib/terminal.js")
  const { state, loadPostures } = await import("@web/lib/store.js")
  const BrandIcon = await import("@web/components/brand-icon.html")
  const { placeOptions, livePlace, placeMark } = await import("@web/lib/places.js")
  const { loadBrands } = await import("@web/lib/brands.js")
  loadBrands()

  if (!state.postures) loadPostures()

  $: choosable = !!state.postures?.choosable
  $: here = livePlace(state.postures, terminal.info?.posture)
  $: hereOption = placeOptions(state.postures).find(o => o.value === here)
  $: mark = placeMark(hereOption?.where)
  // Only what the button does not already say: an open shell needs no word,
  // and neither does one never opened.
  $: said = terminal.moving
    ? "moving the session…"
    : (terminal.status === "open" || terminal.status === "idle" ? "" : terminal.status)
</script>

<span class="terminal-foot">
  <span class="title">Runtime</span>
  <button :if="choosable" type="button" class="face place" :disabled="terminal.moving"
          :title="hereOption ? `${hereOption.title} — move the session` : 'Where this session\'s commands run'"
          aria-haspopup="dialog"
          @click="terminal.choosing = true">
    <BrandIcon :if="mark.src" :src="mark.src" size="12px" />
    <svg :if="!mark.src" class="ic mark"><use :href="mark.glyph"/></svg>
    <span class="label">{{ hereOption?.label || "…" }}</span>
  </button>
  <span class="dim state" :class="terminal.status" :data-place="terminal.info?.place || ''">{{ said }}</span>
  <!-- Open again, once the shell has ended. -->
  <button :if="terminal.status === 'ended'" type="button" class="icon"
          title="Open a new shell" aria-label="Open a new shell" @click="restartTerminal()">
    <svg class="ic"><use href="#i-refresh"/></svg>
  </button>
</span>
