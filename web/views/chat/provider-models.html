<script :setup="{ provider = '', model = '', disabled = false, typable = false, every = false }">
  // Where a session sends, chosen in two columns: the providers in
  // `config.toml`, and the models of the one in focus — what *it* can serve,
  // asked of it when it is focused (`/models`). For a provider whose engine
  // luu starts that is every model on the machine the engine loads, and the
  // ones it cannot load greyed out beside them with why.
  //
  // **One component, two places**: the chat's dropup, which switches the live
  // session the moment a model is chosen, and the new session's dialog, which
  // only takes the choice down. Either way it emits `choose` with
  // `{ provider, model }` and decides nothing itself; `provider` and `model`
  // are what is chosen now, marked with a ✓. Hover or a click puts a provider
  // in focus; nothing is chosen until a model is.
  //
  // It fills the height its parent gives it, and a list longer than that
  // scrolls in its column — so the box does not move while lists arrive.
  // `typable` adds a field under the models for one the provider does not
  // list: a model not pulled yet is still a name worth writing down.
  //
  // **And a third, Settings → Models**, where providers are kept rather than
  // chosen: `every` lists the ones whose engine is switched off too, it emits
  // `focus` with the provider in focus, and the `head` slot sits right of that
  // provider's name over its models — where its own actions go.
  const { state, providerModels, offeredProviders } = await import("@web/lib/store.js")
  const { modelLabel } = await import("@web/lib/engines.js")
  const { brandSrc, providerBrand, modelBrand, loadBrands } = await import("@web/lib/brands.js")
  const BrandIcon = await import("@web/components/brand-icon.html")
  // Each provider and model wears its brand's mark where one is known — see
  // `lib/brands.js`, which also says where the marks are drawn from.
  loadBrands()
  const markOf = name => brandSrc(providerBrand(state.providers?.providers?.[name]))

  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)
  $: canType = flag(typable)

  $: names = flag(every) ? Object.keys(state.providers?.providers || {}) : offeredProviders()
  // The provider whose models the second column shows.
  let focus = ""
  // name → { loading, models, reason, labels, unavailable }. Kept while this
  // is mounted, so going back to a provider does not ask it twice.
  let lists = {}
  $: shown = lists[focus] || null
  $: profile = state.providers?.providers?.[focus] || {}

  const load = async name => {
    if (!name || lists[name]) return
    lists = { ...lists, [name]: { loading: true, models: [], labels: {}, unavailable: [] } }
    const answer = await providerModels(name)
    // The model the profile names is a choice whether or not the provider
    // lists it — it is what a session there starts on — so it is first when
    // the list leaves it out.
    const own = state.providers?.providers?.[name]?.model
    const listed = answer.models || []
    const models = own && !listed.includes(own) ? [own, ...listed] : listed
    lists = {
      ...lists,
      [name]: {
        loading: false,
        models,
        reason: answer.reason || null,
        labels: answer.labels || {},
        unavailable: answer.unavailable || [],
      },
    }
  }
  const focusOn = async name => {
    if (focus !== name) $emit("focus", name)
    focus = name
    await load(name)
  }
  // Opens on the provider chosen, so the second column starts on the models
  // it is choosing among — once, when the providers are known. The flag is in
  // a closure on purpose: a store field written by the line that reads it
  // wakes that line again.
  const start = (() => {
    let started = false
    return list => {
      if (started || !list.length) return
      started = true
      focusOn(list.includes(provider) ? provider : list[0])
    }
  })()
  $: start(names)

  const choose = (name, chosen) => {
    if (isDisabled) return
    $emit("choose", { provider: name, model: chosen })
  }
  let typed = ""
  const chooseTyped = () => {
    const name = typed.trim()
    if (name) choose(focus, name)
  }
  // What a run resolves for a model, in `provider.rs`'s own order: its own
  // entry, then the profile, then the backend's default. The picker used to
  // read the profile alone, so a model entry saying `fenced` could send our
  // fence format while the row said native. See
  // `RECORD/2026-10-25.the-transport-a-run-resolves.completed.md`.
  const profileTransport = p => p?.["tool-calls"] || (p?.backend === "anthropic" ? "native" : "fenced")
  const transportOf = (p, model) => p?.models?.[model]?.["tool-calls"] || profileTransport(p)
  const transportTitle = transport =>
    transport === "native"
      ? "native tools — sent in the request's own `tools` field"
      : "fenced — the tools are text in the prompt, and a call is a fenced block"
  // Under the field, what it would choose.
  const describe = name => {
    const p = state.providers?.providers?.[name] || {}
    return [
      p.backend || "ollama",
      p.engine ? ((state.providers?.idle || []).includes(name) ? "engine off" : "luu starts it") : "",
      transportOf(p, p.model) === "native" ? "native tools" : "",
    ].filter(Boolean).join(" · ")
  }
</script>

<div class="cols" :class.off="isDisabled">
  <ul class="providers" role="listbox" aria-label="Providers">
    <li :each="name in names" :key="name">
      <button type="button" class="prov" role="option"
              :class.on="name === focus" :class.current="name === provider"
              :aria-selected="String(name === focus)"
              @click="focusOn(name)" @mouseenter="focusOn(name)" @focus="focusOn(name)">
        <span class="check">{{ name === provider ? "✓" : "" }}</span>
        <span class="mark"><BrandIcon :src="markOf(name)" /></span>
        <span class="text">
          <strong>{{ name }}</strong>
          <span class="dim small">{{ describe(name) }}</span>
        </span>
        <svg class="ic go"><use href="#i-caret"/></svg>
      </button>
    </li>
  </ul>

  <div class="models" role="listbox" aria-label="Models">
    <div class="models-head dim small">
      <BrandIcon :src="markOf(focus)" size="12px" />
      <strong>{{ focus }}</strong>
      <span :if="profile.engine">· engine {{ profile.engine }}</span>
      <span :if="$slots.head" class="head-acts"><slot.head /></span>
    </div>
    <p :if="shown?.loading" class="dim small pad">asking the provider…</p>
    <p :if="shown?.reason &amp;&amp; !shown?.models.length" class="dim small pad">{{ shown?.reason }}</p>
    <button :each="name in shown?.models || []" :key="name" type="button"
            class="model" role="option"
            :class.on="focus === provider &amp;&amp; name === model"
            :disabled="isDisabled"
            @click="choose(focus, name)">
      <span class="check">{{ focus === provider &amp;&amp; name === model ? "✓" : "" }}</span>
      <span class="mark"><BrandIcon :src="brandSrc(modelBrand(name))" size="12px" /></span>
      <span class="name">{{ shown?.labels?.[name] || modelLabel(name) }}</span>
      <span class="tools" :class.native="transportOf(profile, name) === 'native'"
            :title="transportTitle(transportOf(profile, name))">
        <svg class="ic" role="img" :aria-label="transportTitle(transportOf(profile, name))">
          <use :href="transportOf(profile, name) === 'native' ? '#i-tools-native' : '#i-tools-fenced'"/>
        </svg>
      </span>
    </button>
    <!-- On this machine and not loadable by this provider's engine — an
         MLX model under llama.cpp, ollama's own MLX under anything but
         ollama. Shown rather than hidden, so a model on the disk does not
         look missing; the tooltip is the server's own reason. Not a
         button: a disabled one shows no tooltip in every browser. -->
    <div :each="u in shown?.unavailable || []" :key="u.model"
         class="model off" role="option" aria-disabled="true"
         :title="u.reason">
      <span class="check warn">⚠</span>
      <span class="mark"><BrandIcon :src="brandSrc(modelBrand(u.model))" size="12px" /></span>
      <span class="name">{{ u.label }}</span>
    </div>
    <!-- A provider whose list is empty is still a destination: its own
         model, or the one the server picks. -->
    <button :if="shown &amp;&amp; !shown.loading &amp;&amp; !shown.models.length" type="button"
            class="model" :disabled="isDisabled" @click="choose(focus, '')">
      <span class="check"></span>
      <span class="name dim">use it with its own model</span>
    </button>
    <label :if="canType &amp;&amp; shown &amp;&amp; !shown.loading" class="typed">
      <span class="dim small">another model</span>
      <input type="text" :value="typed" :disabled="isDisabled" placeholder="a model name, then Enter"
             @input="typed = $event.target.value" @keydown.enter="chooseTyped()">
    </label>
  </div>
</div>
