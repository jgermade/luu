<script :setup>
  // The earlier sessions, behind the clock in the chat's head: a search over
  // them and the list, in the order they were last written to. It was a
  // popover under the clock; a list of seventy sessions named by their ids
  // wanted room and a way to find one, and a modal has both. See
  // `RECORD/2026-10-21.sessions-that-name-themselves.completed.md`.
  const { state, resumeSession, deleteSession, refreshSessionsList } = await import("@web/lib/store.js")
  const { closeHistory } = await import("@web/lib/ui.js")
  const Modal = await import("@web/components/modal.html")
  const TextInput = await import("@web/components/text-input.html")

  // False once it should leave: `Modal` plays the exit, then `close` unmounts.
  let open = true
  let query = ""
  // Deleting asks twice: the first click on a row's × arms it.
  let armed = ""
  let error = ""
  let switching = ""

  // Asked again on every opening: the counts move with every turn.
  refreshSessionsList()

  // The search is what a person opening this came to use. `showModal` gives
  // the focus to the dialog's first control, its close button, so it is moved
  // here once the dialog is open — a few frames, at most, after mounting.
  const focusSearch = (frames = 30) => {
    const input = document.querySelector("dialog[open] .sessions-search input")
    if (input) input.focus()
    else if (frames > 0) requestAnimationFrame(() => focusSearch(frames - 1))
  }
  requestAnimationFrame(() => focusSearch())

  const named = s => !!s?.title && s.title !== "live" && !s.title.startsWith("session-")
  const nameOf = s => named(s) ? s.title : "Untitled session"
  // Case and accents folded, so `configuracion` finds *Configuración*.
  const fold = text => (text || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
  const when = s => {
    const ms = s.written_at ?? s.started_at
    if (!ms) return ""
    const date = new Date(ms)
    const today = new Date().toDateString() === date.toDateString()
    return today
      ? date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
      : date.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
  }
  const isCurrent = s => s.id === state.currentSessionId

  // The order the server's `written_at` gives, and a session nothing was sent
  // in left out unless it is the one on screen — it holds nothing to open.
  $: listed = [...(state.sessions || [])]
    .filter(s => s.turns > 0 || isCurrent(s))
    .sort((a, b) => (b.written_at ?? b.started_at ?? 0) - (a.written_at ?? a.started_at ?? 0))
  $: words = fold(query).split(/\s+/).filter(Boolean)
  $: rows = words.length
    ? listed.filter(s => {
      const hay = fold(`${nameOf(s)} ${s.id}`)
      return words.every(word => hay.includes(word))
    })
    : listed

  const pick = async s => {
    if (switching) return
    if (isCurrent(s)) {
      open = false
      return
    }
    switching = s.id
    error = ""
    const ok = await resumeSession(s.id)
    switching = ""
    if (ok) {
      open = false
      return
    }
    // A turn still running is the usual one: the server refuses to leave it.
    error = state.error || "the session could not be opened"
  }

  const remove = async (s, event) => {
    event.stopPropagation()
    if (armed !== s.id) {
      armed = s.id
      return
    }
    armed = ""
    await deleteSession(s.id)
  }
</script>

<Modal title="Sessions" width="38rem" :open="open" @close="closeHistory()">
  <section class="modal-body">
    <div class="modal-main">
      <div class="search sessions-search">
        <TextInput :model="query" placeholder="Search by name" autofocus clearable @input="armed = ''" />
      </div>

      <p :if="error" class="error">{{ error }}</p>

      <ul :if="rows.length" class="sessions" @click="armed = ''">
        <li :each="s in rows" :key="s.id" :class.on="isCurrent(s)">
          <button type="button" class="pick" :title="s.id" :disabled="!!switching" @click="pick(s)">
            <span class="name" :class.untitled="!named(s)">{{ nameOf(s) }}</span>
            <span class="facts dim">
              {{ when(s) }} · {{ s.turns }} {{ s.turns === 1 ? "turn" : "turns" }}<span :if="isCurrent(s)"> · open</span><span :if="switching === s.id"> · opening…</span>
            </span>
          </button>
          <!-- Only where the server would take it: not the session on screen. -->
          <button :if="!isCurrent(s) && s.id !== 'live'" type="button" class="close"
                  :class.armed="armed === s.id"
                  :title="armed === s.id ? 'Click again to delete this session and its stream' : 'Delete this session'"
                  @click="remove(s, $event)">
            <svg class="ic"><use href="#i-close"/></svg>
          </button>
        </li>
      </ul>
      <p :if="!rows.length && words.length" class="dim">No session matches “{{ query.trim() }}”.</p>
      <p :if="!listed.length" class="dim">No sessions yet.</p>
    </div>
  </section>
</Modal>
