<script :setup>
  // The context as it stands: what the newest turn sent, opened from the
  // indicator beside the composer. The same view as a turn's own Context tab
  // (`context-view.html`), about the one turn somebody about to type is
  // adding to — so "how full is it, and with what" has an answer before the
  // next prompt rather than after it. Nothing is fetched: it is the budget
  // and the prompt the trace channel last sent. See
  // `RECORD/2026-09-30.the-foot-and-the-turn.completed.md`.
  const { state } = await import("@web/lib/store.js")
  const { closeContext } = await import("@web/lib/ui.js")
  const Modal = await import("@web/components/modal.html")
  const ContextView = await import("./context-view.html")

  // `state.budget` is read where it is used, never copied into this
  // component's store: `$: budget = state.budget` put one store's object in
  // another's, and jq79 woke the effect that read it a hundred times in a row
  // — the loop the smoke suite caught intermittently. See
  // `RECORD/2026-09-30.the-foot-and-the-turn.completed.md`.
  $: sent = (state.budget?.buckets || []).filter(b => b.name !== "reserve").reduce((sum, b) => sum + b.tokens, 0)
  $: reserve = (state.budget?.buckets || []).find(b => b.name === "reserve")?.tokens || 0
  // The turn's own window, or the session's where that turn had none.
  $: limit = state.budget?.limit || state.settings?.window || null
  $: percent = limit ? Math.round((sent / limit) * 100) : null
  $: turn = state.history.length ? state.history[state.history.length - 1].turn : null
  $: asked = [...state.messages].reverse().find(m => m.role === "user")?.text || ""
  // The reply to that prompt, streaming or done: the one thing the context as
  // it stands has that the prompt it was measured from cannot.
  const replyTo = (messages, turn) => {
    const last = messages[messages.length - 1]
    return last?.role === "assistant" && (turn === null || last.turn === turn) ? last.text || "" : ""
  }
  $: answer = replyTo(state.messages, turn)
  $: notes = [state.settings?.authority?.draft?.text, state.settings?.authority?.plan?.text].filter(Boolean)
  // How this turn's tools travelled, read from what it actually sent rather
  // than from what the profile says: `toolSpecs` is the request's own `tools`
  // field (native only), and the fenced transport puts the definitions in the
  // prompt's `# Tools` block. Neither is present when the session has no tools
  // or the trace was off, and then there is nothing true to say.
  $: transport = state.toolSpecs
    ? "native"
    : (state.prompt || "").includes("# Tools") ? "fenced" : null

  // The whole context as it was sent, for pasting into a conversation: the
  // prompt's exact bytes, and under the native transport the request's own
  // `tools` field beside them — which is not in the text, and is part of what
  // the model saw. The answer is not context: it was never sent.
  let copied = false
  const contextText = () => {
    const prompt = state.prompt || ""
    const specs = state.toolSpecs || ""
    return specs ? `${prompt}\n\n# the request's tools field, sent beside this text\n${specs}` : prompt
  }
  const copyContext = async () => {
    try {
      await navigator.clipboard.writeText(contextText())
    } catch {
      return
    }
    copied = true
    setTimeout(() => { copied = false }, 1500)
  }
</script>

<Modal title="Context" width="64rem" @close="closeContext()">
  <template :slot.head>
    <span :if="turn !== null" class="dim">as of turn {{ turn }}</span>
  </template>

  <div :if="state.budget" class="facts">
    <div><span class="k">context</span><b :class.warn="percent !== null && percent >= 80">{{ sent }} / {{ limit || "—" }}</b></div>
    <div :if="state.settings?.window_from === 'server'"
         title="Nothing declared a window, so luu asked the server which it serves">
      <span class="k">window from</span><b>the server</b>
    </div>
    <div :if="reserve"><span class="k">kept for the answer</span><b>{{ reserve }}</b></div>
    <div :if="state.budget.backendPrompt"
         title="What the server counted. The difference from ours is the chat template, and under native tool calls the tools it rendered.">
      <span class="k">the server counted</span><b>{{ state.budget.backendPrompt }}</b>
    </div>
    <div :if="transport"
         title="Read from this turn, not from the profile: native sent the tools in the request's own field, fenced put them in the prompt as text.">
      <span class="k">tools</span><b>{{ transport }}</b>
    </div>
    <button type="button" class="copy" :disabled="!state.prompt"
            :title="copied ? 'Copied' : 'Copy the whole context, as it was sent'"
            :aria-label="copied ? 'Copied' : 'Copy the whole context, as it was sent'"
            @click="copyContext()">
      <svg class="ic"><use :href="copied ? '#i-check' : '#i-copy'"/></svg>
      <span>{{ copied ? "Copied" : "Copy context" }}</span>
    </button>
  </div>

  <section class="modal-body">
    <!-- The content pads itself, and so does the foot beside it: the body
         holds both and pads neither. -->
    <div class="modal-main">
      <p :if="!state.budget" class="dim">
        Nothing has been sent in this session yet. The context is measured when a
        turn is built, so it is here from the first prompt on.
      </p>
      <ContextView :if="state.budget" :prompt="state.prompt || ''" :toolSpecs="state.toolSpecs || ''"
                   :budget="state.budget"
                   :asked="asked" :extraCalls="state.extraCalls || []" :notes="notes"
                   :window="state.settings?.window || null" :answer="answer" :tools="state.tools || []" />
    </div>
  </section>
</Modal>
