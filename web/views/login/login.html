<script :setup>
  // The page on a server with users, before a login: an email and the code
  // `luu user code` printed for it. Nothing else of the app loads until the
  // server knows who this is — every route behind the login would be a 401.
  // See `RECORD/2026-11-03.a-user-a-code-and-a-folder.WIP.md`.
  const { logIn } = await import("@web/lib/account.js")

  let email = ""
  let code = ""
  let busy = false
  let said = ""

  $: ready = email.includes("@") && code.replace(/\s/g, "").length === 6 && !busy

  const submit = async () => {
    if (!ready) return
    busy = true
    said = ""
    const problem = await logIn(email.trim(), code)
    busy = false
    if (problem) {
      said = problem
      return
    }
    location.reload()
  }
</script>

<div class="login">
  <div class="card">
    <img class="logo" src="./logo.svg" alt="" width="40" height="40">
    <h1>Log in to luu</h1>
    <p class="lead">This server has users. Log in with your email and a code.</p>

    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" autofocus
           :value="email" @input="email = $event.target.value"
           @keydown.enter="submit()">

    <label for="login-code">Code</label>
    <input id="login-code" class="code" inputmode="numeric" autocomplete="one-time-code"
           maxlength="7" placeholder="123456"
           :value="code" @input="code = $event.target.value"
           @keydown.enter="submit()">

    <button type="button" class="go" :disabled="!ready" @click="submit()">
      {{ busy ? "Logging in…" : "Log in" }}
    </button>
    <p :if="said" class="said" role="alert">{{ said }}</p>

    <p class="note">
      An owner of this server gives you a code. On the server itself,
      <code>luu user code &lt;email&gt;</code> prints one: six digits,
      valid for ten minutes, once.
    </p>
  </div>
</div>
