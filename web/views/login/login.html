<script :setup>
  // The page on a server with users, before a login: an email and the code
  // `luu user code` printed for it. Nothing else of the app loads until the
  // server knows who this is — every route behind the login would be a 401.
  // See `RECORD/2026-11-03.a-user-a-code-and-a-folder.completed.md`.
  const { logIn, emailCode, account } = await import("@web/lib/account.js")
  const OtpInput = await import("@web/components/otp-input.html")

  let email = ""
  let code = ""
  let busy = false
  let said = ""
  // The code boxes' state: shaken red on a refusal, ringed green on a login.
  let status = "idle"

  $: ready = email.includes("@") && code.length === 6 && !busy

  const submit = async () => {
    if (!ready) return
    busy = true
    said = ""
    status = "idle"
    const problem = await logIn(email.trim(), code)
    busy = false
    if (problem) {
      said = problem
      status = "error"
      return
    }
    status = "success"
    // Long enough for the ring to draw round every box.
    setTimeout(() => location.reload(), 800)
  }

  // A code by email, where the server has mail. The answer is the same
  // whoever asked; the button rests a minute, as the server does.
  let mailed = ""
  let resting = false
  const mailMe = async () => {
    if (!email.includes("@") || resting) return
    said = ""
    const problem = await emailCode(email.trim())
    if (problem) { said = problem; return }
    mailed = "If that address has an account here, a code is on its way."
    resting = true
    setTimeout(() => { resting = false }, 60_000)
  }

  // An edit after a refusal: the boxes are waiting again.
  const edited = () => {
    if (status === "error") status = "idle"
    said = ""
  }
</script>

<div class="login">
  <div class="card">
    <img class="logo" src="./logo.svg" alt="" width="40" height="40">
    <h1>Log in to luu</h1>
    <p class="lead">Log in with your email and the code sent to it.</p>

    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" autofocus
           :value="email" @input="email = $event.target.value"
           @keydown.enter="submit()">

    <button :if="account.mail" type="button" class="mail" :disabled="!email.includes('@') || resting"
            @click="mailMe()">Email me a code</button>
    <p :if="mailed" class="mailed">{{ mailed }}</p>

    <span class="label" id="login-code">Code</span>
    <div class="code">
      <OtpInput :model="code" :status="status" :disabled="busy" label="Code"
                @change="edited()" @complete="submit()" />
    </div>

    <button type="button" class="go" :disabled="!ready" @click="submit()">
      {{ busy ? "Logging in…" : "Log in" }}
    </button>
    <p :if="said" class="said" role="alert">{{ said }}</p>

    <p class="note" :if="!account.mail">
      This server sends no mail yet, so an owner gives you a code. On the
      server itself, <code>luu user code &lt;email&gt;</code> prints one: six
      digits, valid for ten minutes, once.
    </p>
  </div>
</div>
