<!-- Resend: what a turn sends again. Was `resend.html`. -->
<template name="SettingsResend">
<script :setup>
  // The three rules that decide how much of the history a turn pays for again.
  //
  // **Not in General**, and that is a decision rather than a layout: the
  // sections there are facts about the *screen* — a theme, a layout, which
  // editor draws a file — and live in `localStorage`, where a server answers
  // two people on two machines and neither's preference changes what is sent.
  // These three change the bytes the model receives, so they belong beside
  // Models, which is the other section in this modal that is about the run
  // rather than about the reader. See
  // `RECORD/2026-09-18.the-window-rules-are-a-session-fact.completed.md` part 4.
  //
  // The section exists because the rules were built, measured, tested and off,
  // reachable only by typing a flag and restarting the server — which is the
  // sentence `the-gate-panel-narrows` wrote one surface along: a narrowing
  // nobody can reach from the surface they actually use is a narrowing nobody
  // applies.
  const [{ state, loadResend, saveResend }, ChoiceSegmented, SaveButton, PathText] = await C79.importAll([
    "@web/lib/store.js",
    "@web/theme/default/components/choice-segmented.html",
    "@web/components/save-button.html",
    "@web/components/path-text.html",
  ])

  // `""` is drawn as the word it means here.
  const UNSET = { value: "", label: "unset" }
  const REPEAT = [UNSET, "always", "once"]
  const PRUNE = [UNSET, "never", "behind"]
  const RESULTS = [UNSET, "kept", "cited_reads", "cited"]

  // Asked here and awaited here, like the providers section: `openSettings`
  // only mounts the component, and a `:setup` runs to completion before the
  // template renders, so the draft below is a draft of something.
  await loadResend()

  // A *copy* of the file's table. Typing into the server's own answer would
  // make an unsaved change look saved — and here it would look like something
  // stronger than saved, because the panel beside it says what is running.
  //
  // `""` is the file saying nothing about a rule, which is not the same object
  // as the file choosing the default: a machine that states no position leaves
  // a session on whatever is already in place.
  let draft = {
    repeat: state.resend?.file?.repeat || "",
    prune: state.resend?.file?.prune || "",
    results: state.resend?.file?.results || "",
  }

  const save = async () => {
    const ok = await saveResend({
      ...(draft.repeat ? { repeat: draft.repeat } : {}),
      ...(draft.prune ? { prune: draft.prune } : {}),
      ...(draft.results ? { results: draft.results } : {}),
    })
    draft = {
      repeat: state.resend?.file?.repeat || "",
      prune: state.resend?.file?.prune || "",
      results: state.resend?.file?.results || "",
    }
    return ok
  }

  $: editable = !!state.resend?.editable
  // How many of the three the draft moves away from the file.
  $: changes = ["repeat", "prune", "results"]
    .filter(key => draft[key] !== (state.resend?.file?.[key] || "")).length
  $: running = state.resend?.running || {}
  $: waiting = state.resend?.waiting || []
  // Whether the file and the live session disagree, which is ordinary rather
  // than wrong: a session may have been started under a rule nobody wrote down.
  $: differs = key => !!state.resend?.file?.[key]
    && state.resend.file[key] !== running[key]
</script>

    <b>once</b> renders a span in the <b>oldest</b> turn of the window that

    <b>behind</b> makes the oldest turns give up their code and keep their
    exchange: the span becomes the line that cites it, the question and the
    answer stay. What it buys is not tokens — on the same 20 turns the prompt
    moves −0.3% and <b>nothing is evicted at all</b>, 0 turns dropped against

  <dt>Results</dt>
  <dd>

      <span class="rule-pill warn"><strong>cited</strong> · poda también salida de comandos</span>
      <span class="rule-pill dim"><strong>kept</strong> · conserva todas las respuestas de tools</span>
    </div>
    Both replace a tool result behind the prune line with the line that cites
    it, and both are <b>inert without prune</b>. What they differ on is which
    results: <b>cited_reads</b> gives up what could be asked for again — a
    file's bytes, a directory listing — and keeps what a command found.
    <b>cited</b> gives up a command's output too.
  </dd>
  <dd class="note caveat">
    The 32 752 tokens this rule freed over 20 turns were measured on a corpus
    where every turn read a 136 KB file and hit the 8 KiB cap, and where

    that happened, and a model reasoning about a <code>cargo test</code> it can
    no longer see is the open question this rule has had since the day it
    landed.
  </dd>

  <dd class="note caveat">
    <b>unset</b> is this machine stating no position, which leaves a session on
    whatever is already running. It is not the same as choosing the left-hand
    value.

<!-- Authority: the two notes a session states. Was `authority.html`. -->
<template name="SettingsAuthority">
<script :setup>
  // What a draft or a plan is told about the authority it runs under, as
  // opposed to what `crate::sandbox` enforces without saying so.
  //
  // Beside Resend for the same reason it is beside it in `[authority]`:
  // `Authority::Draft` and `Authority::Plan` already narrow what a turn may
  // *do*, and until this landed nothing narrowed what it *reads* about that —
  // a draft that tries to write discovered the floor by being refused, and a
  // refusal is a turn. See
  // `RECORD/2026-09-22.an-authority-a-model-is-told.completed.md`.
  const [{ state, loadAuthority, saveAuthority }, ChoiceSegmented, SaveButton, PathText, Textarea] = await C79.importAll([
    "@web/lib/store.js",
    "@web/theme/default/components/choice-segmented.html",
    "@web/components/save-button.html",
    "@web/components/path-text.html",
    "@web/theme/default/components/textarea.html",
  ])

  const POSITIONS = [{ value: "", label: "system (default)" }, "prompt"]

  await loadAuthority()

  // A *copy* of the file's two tables, [`SettingsResend`]'s reason exactly:
  // typing into the server's own answer would make an unsaved change look
  // saved. `""` throughout is the file saying nothing, which unsets the field
  // rather than choosing a value for it.
  let draft = {
    draftText: state.authority?.file?.draft?.text || "",
    draftPosition: state.authority?.file?.draft?.position || "",
    planText: state.authority?.file?.plan?.text || "",
    planPosition: state.authority?.file?.plan?.position || "",
  }

  const set = (key, value) => { draft = { ...draft, [key]: value } }

  // One note's half of the body: absent (not `{}`) when there is no text,
  // so a table with nothing to say does not write an empty one into the file.
  const note = (text, position) =>
    text ? { text, ...(position ? { position } : {}) } : undefined

  const save = async () => {
    const ok = await saveAuthority({
      draft: note(draft.draftText, draft.draftPosition),
      plan: note(draft.planText, draft.planPosition),
    })
    draft = {
      draftText: state.authority?.file?.draft?.text || "",
      draftPosition: state.authority?.file?.draft?.position || "",
      planText: state.authority?.file?.plan?.text || "",
      planPosition: state.authority?.file?.plan?.position || "",
    }
    return ok
  }

  $: editable = !!state.authority?.editable
  // How many of the four fields the draft moves away from the file.
  $: changes = [
    [draft.draftText, state.authority?.file?.draft?.text],
    [draft.draftPosition, state.authority?.file?.draft?.position],
    [draft.planText, state.authority?.file?.plan?.text],
    [draft.planPosition, state.authority?.file?.plan?.position],
  ].filter(([mine, file]) => mine !== (file || "")).length
  $: running = state.authority?.running || {}
  // Whether the file names a note the live session is not (yet) telling a
  // turn — a session may have started before this table existed, or under a
  // different one this table has since replaced.
  $: differs = key => {
    const asked = state.authority?.file?.[key]?.text || ""
    const live = running[key]?.text || ""
    return !!asked && asked !== live
  }
</script>
