<script :setup>
  // Settings, as sections down the side rather than as one scroll.
  //
  // The shape every operating system's settings window has converged on, for
  // the reason that the sections are **not steps**: a theme and a provider
  // table have nothing to do with each other, and stacking them made the second
  // one the reward for scrolling past the first. See
  // `RECORD/2026-09-16.three-columns-that-each-have-a-footer.completed.md`.
  const { closeSettings, state } = await import("@web/lib/store.js")
  const { ui } = await import("@web/lib/ui.js")
  const Modal = await import("@web/components/modal.html")
  // Mounted here as well as in `app.html`, and the duplication is the point:
  // `Modal` decides it is a child by looking for an open `dialog.modal` above
  // it **in the DOM**, so the same component is a sheet inside Settings here
  // and a window of its own there. Both are reached from Settings, so opened
  // from it they belong in it.
  const SessionsDialog = await import("@web/views/chat/sessions-dialog.html")
  const Project = await import("@web/views/inspector/tree/project.html")
  const { workspace } = await import("@web/lib/workspace.js")

  const SettingsGeneral = await import("./general/general.html")
  const SettingsAppearance = await import("./appearance/appearance.html")
  const SettingsModels = await import("./models/models.html")
  const SettingsEngines = await import("./engines/engines.html")
  const SettingsRuntimes = await import("./runtimes/runtimes.html")
  const SettingsSessions = await import("./sessions/sessions.html")
  const SettingsPolicies = await import("./policies/policies.html")
  const Rail = await import("@web/components/rail.html")

  const SECTIONS = [
    // Engines before Models: a provider can name an engine, so the thing it
    // names comes first. Resend and Authority are one section, Sessions —
    // see `views/settings/sessions/sessions.html`.
    { value: "general", label: "General", icon: "i-sliders" },
    // How the page looks on this screen: the editor and the chat's code, the
    // columns, the tree's icons. See `appearance/appearance.html`.
    { value: "appearance", label: "Appearance", icon: "i-palette" },
    { value: "engines", label: "Engines", icon: "i-chip" },
    { value: "models", label: "Models", icon: "i-server" },
    // Where a session's commands run: the container runtimes, their images,
    // the postures and the host shell. Beside Sessions, because a posture is
    // chosen per session. See `runtimes/runtimes.html`.
    { value: "runtimes", label: "Runtimes", icon: "i-box" },
    // What a session may do: the shell, network and files lists, and the
    // environments that combine them. See `policies/policies.html`.
    { value: "policies", label: "Policies", icon: "i-shield" },
    { value: "sessions", label: "Sessions", icon: "i-repeat" },
  ]

  // **A change of section is a transition, not a swap, and its end is known
  // before it starts.** The section chosen is mounted at once but invisible,
  // and loads what it loads; once its height has settled (unchanged for 90ms,
  // or 700ms at the most) the pane's height goes from the old section's to
  // that one's while the two cross-fade — one motion, to a height already
  // measured. What it replaced was a fade out, a swap, a measurement, and a
  // second jump when the new section's data landed.
  //
  // Mounted per visit rather than all at once, so a section is never stale: a
  // provider added from Engines is in Models the next time Models is opened,
  // and nothing hidden goes on polling.
  //
  // `shown` is on screen, `next` is being prepared, `leaving` is fading out.
  // `height` is the stage's, measured by a ResizeObserver — the stage is as
  // tall as `shown`, since the other two are laid out on top of it — plus the
  // pane's padding, capped at what the window leaves the dialog.
  let shown = ui.section
  let next = null
  let leaving = null
  const FADE_MS = 240

  const mounted = name => name === shown || name === next || name === leaving
  const phase = name => name === shown ? "on" : name === leaving ? "leaving" : "prep"

  // A closure rather than store fields: the `$:` below must read `ui.section`
  // and nothing it writes, or writing it would run it again.
  const switchTo = (() => {
    let current = ui.section
    let token = 0
    return target => {
      if (target === current) return
      current = target
      const mine = ++token
      if (target === shown) {
        next = null
        return
      }
      leaving = shown
      shown = target
      next = null
      const pane = $self(".pane")
      if (pane) pane.scrollTop = 0
      setTimeout(() => { if (mine === token) leaving = null }, FADE_MS)
    }
  })()
  $: switchTo(ui.section)
</script>

<Modal title="Settings" width="76rem" variant="folio" animation="folio" @close="closeSettings()">

  <div class="sections">
    <!-- The rail. The third section is the one the shape was said to make
         free, and it was: a name and a component, no place in a scroll. It is
         here rather than in General because General is facts about the
         *screen* — a theme, a layout, which editor draws a file, all in
         `localStorage` — and these three change the bytes a run sends. A
         preference that changes the prompt is not a preference. See
         `RECORD/2026-09-18.the-window-rules-are-a-session-fact.completed.md`. -->
    <div class="rail-col">
      <Rail :items="SECTIONS" :model="ui.section" :slot="{ item }">
        <svg class="ic"><use :href="'#' + item.icon"/></svg>
        <span>{{ item.label }}</span>
      </Rail>
    </div>

    <section class="modal-body pane">
      <div class="stage">
        <div :if="mounted('general')" class="section" data-section="general" :class="phase('general')"
             :aria-hidden="String(shown !== 'general')"><SettingsGeneral /></div>
        <div :if="mounted('appearance')" class="section" data-section="appearance" :class="phase('appearance')"
             :aria-hidden="String(shown !== 'appearance')"><SettingsAppearance /></div>
        <div :if="mounted('engines')" class="section" data-section="engines" :class="phase('engines')"
             :aria-hidden="String(shown !== 'engines')"><SettingsEngines /></div>
        <div :if="mounted('runtimes')" class="section" data-section="runtimes" :class="phase('runtimes')"
             :aria-hidden="String(shown !== 'runtimes')"><SettingsRuntimes /></div>
        <div :if="mounted('models')" class="section" data-section="models" :class="phase('models')"
             :aria-hidden="String(shown !== 'models')"><SettingsModels /></div>
        <div :if="mounted('sessions')" class="section" data-section="sessions" :class="phase('sessions')"
             :aria-hidden="String(shown !== 'sessions')"><SettingsSessions /></div>
        <div :if="mounted('policies')" class="section" data-section="policies" :class="phase('policies')"
             :aria-hidden="String(shown !== 'policies')"><SettingsPolicies /></div>
      </div>
    </section>
  </div>

  <!-- Inside the dialog, so they open as sheets over Settings rather than as
       a second window on top of it. -->
  <SessionsDialog :if="ui.sessions" />
  <Project :if="workspace.picker.open" />
</Modal>

<style scoped>
  .sections {
    display: grid;
    grid-template-columns: 12rem minmax(0, 1fr);
    min-height: 0;
    height: 100%;
    flex: 1;
    overflow: hidden;
  }
  .rail-col {
    padding: .6rem .4rem;
    /* Its ground and inks are the chat's — `.rail-col` in `app.css`. */
    border-right: 1px solid var(--luu-border);
    background: var(--luu-chat-bg);
    overflow-y: auto;
    height: 100%;
    box-sizing: border-box;
  }
  .pane {
    min-width: 0;
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    box-sizing: border-box;
    /* A column all the way down to each section's own pane, so a pinned foot's
       `margin-top: auto` reaches the bottom when the content is shorter than
       the pane — see RECORD/2026-10-08.settings-design-system-and-folio. */
    display: flex;
    flex-direction: column;
    /* Nothing: each section pads itself, and a section's foot reaches the
       pane's edges because nothing here holds it in. */
    padding: 0;
    scroll-padding-bottom: 4rem;
  }
  /* One section in the flow, which is what the pane scrolls; the others laid
     out on top of it, invisible and inert, so each one's height is always
     known. The chosen one fades in as the one it replaces fades out. */
  .stage {
    position: relative;
    flex: 1 0 auto;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .section {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  /* Being prepared: laid out, loading, measured, and not seen. */
  .section.prep { transition: none; }
  .section.leaving {
    visibility: visible;
    opacity: 0;
    transition: opacity .16s ease-out;
  }
  .section.on {
    position: relative;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .22s ease-in .06s;
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
  }
  @media (prefers-reduced-motion: reduce) {
    .pane, .section, .section.on, .section.leaving { transition: none; }
  }
</style>
