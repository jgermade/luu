<script :setup="{ view = null, editing = '', found = null, saved = null, close = null }">
  // An engine, installed or edited, as a sheet over Settings → Engines — laid
  // out as an installer: **which kind**, **where its binary comes from** (luu's
  // own copy, one this machine has, or a path), and **where it listens**. The
  // model is not asked: a session chooses it, and the engine loads what the
  // session chose. See
  // `RECORD/2026-10-26.engines-installed-and-started.completed.md`.
  //
  // Adding one also writes the provider that starts it, because an engine
  // nothing names is a server no session will ever ask for; and *Install*, on
  // luu's own copy, downloads it here and closes when it is on disk.
  //
  // A path must end in the kind's own binary name, which the server checks
  // again: see `accepts_from_page` in `crate::engines`. `found` — `{ kind,
  // path, name }`, a binary the machine has that no table runs yet: the form
  // opens on it, under the name its card showed.
  const { saveEngines, installEngine, loadEngines, profileFor, defaultPort, freePort, tableOf } =
    await import("@web/lib/engines.js")
  const { state, loadProviders, saveProviders } = await import("@web/lib/store.js")
  const SubModal = await import("@web/theme/default/components/sub-modal.html")
  const Button = await import("@web/theme/default/components/button.html")
  const InputContainer = await import("@web/theme/default/components/input-container.html")
  const Checkbox = await import("@web/theme/default/components/checkbox.html")
  const BrandIcon = await import("@web/components/brand-icon.html")
  const { brandSrc, engineBrand, loadBrands } = await import("@web/lib/brands.js")
  loadBrands()

  // False once it should leave: `SubModal` plays the exit, then `close`
  // unmounts it.
  let open = true
  const leave = () => {
    open = false
    clearTimeout(polling)
    const ms = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--luu-duration"))
    setTimeout(() => close?.(), Number.isFinite(ms) ? ms : 0)
  }

  const current = editing ? view?.engines?.[editing] : null
  const quote = arg => (/\s/.test(arg) ? `"${arg}"` : arg)
  // A line as a shell would split it, quotes and all — but nothing is
  // expanded: there is no shell, so `~` in a path stays a `~`.
  const split = line =>
    [...line.matchAll(/"([^"]*)"|'([^']*)'|(\S+)/g)].map(m => m[1] ?? m[2] ?? m[3])

  const KINDS = [
    { value: "llama", name: "llama.cpp", says: "llama-server · 12 MB · GGUF, one model per server", note: "recommended" },
    { value: "mlx", name: "MLX", says: "mlx-serve · Apple Silicon · MLX and GGUF" },
    { value: "ollama", name: "Ollama", says: "its own model store and its own MLX · 160 MB" },
  ]
  const BINS = { llama: "llama-server", mlx: "mlx-serve", ollama: "ollama" }
  // Why a kind has no release here, where it has none (`cannot_install`).
  const cannot = k => view?.cannot_install?.[k] || ""
  const foundOf = k => view?.found?.[k] || []
  // A kind is offered when there is something to run: a release to download
  // or a binary already here.
  const offered = k => !cannot(k) || foundOf(k).length > 0

  let kind = current?.kind || found?.kind || KINDS.find(k => offered(k.value))?.value || "llama"
  // "managed", "found" (one of `foundOf(kind)`), "path", or "auto" — an
  // edited table with no `binary`, which runs whichever this machine has.
  let source = found
    ? "found"
    : !current
      ? (cannot(kind) && foundOf(kind).length ? "found" : "managed")
      : !current.binary
        ? "auto"
        : current.binary === "managed"
          ? "managed"
          : foundOf(current.kind).includes(current.binary) ? "found" : "path"
  let foundPath = found?.path || (source === "found" ? current.binary : foundOf(kind)[0] || "")
  let path = source === "path" ? current.binary : ""
  let version = current?.version || ""
  let variant = current?.variant || ""
  let name = editing || found?.name || ""
  let port = current?.port ? String(current.port) : ""
  // **Automatic by default**: no `port` in the table, and luu places the
  // engine on the first free port from its kind's own when something first
  // needs it. A table that names a port is a port somebody chose, and an
  // edit shows it so. See `RECORD/2026-10-26.ports-luu-places.completed.md`.
  let auto = !current?.port
  // Where an automatic one listens now, if this process has placed it.
  const placedAt = (() => {
    try { return current?.url ? new URL(current.url).port : "" } catch { return "" }
  })()
  let args = (current?.args || []).map(quote).join(" ")
  let readyTimeout = current?.["ready-timeout"] ? String(current["ready-timeout"]) : ""
  let withProvider = !editing
  let saving = false
  // The name this form wrote, once it has: the view it is handed back has the
  // engine in it, and the engine being added is not a clash with itself while
  // its provider is written or its copy downloads.
  let wrote = ""
  let error = ""
  // The download *Install* started, as the server reports it.
  let download = null
  let polling = null

  // A name and a port to start from, for a new one: the kind's own name,
  // numbered past one that is taken, and the first port nothing has.
  const freeName = k => {
    let candidate = k
    for (let n = 2; view?.engines?.[candidate]; n++) candidate = `${k}-${n}`
    return candidate
  }
  let suggested = ""
  const suggest = async k => {
    if (editing) return
    if (!name.trim() || name === suggested) name = suggested = freeName(k)
    if (!auto) await suggestPort(k)
  }
  // A fixed port starts from the first one nothing has.
  const suggestPort = async k => {
    const free = await freePort(k)
    if (free.ok && !port.trim()) port = String(free.port)
  }
  const setAuto = on => {
    auto = on
    if (!on) suggestPort(kind)
  }
  suggest(kind)
  const chooseKind = k => {
    if (editing || !offered(k) || k === kind) return
    kind = k
    port = ""
    source = cannot(k) && foundOf(k).length ? "found" : "managed"
    foundPath = foundOf(k)[0] || ""
    path = ""
    variant = ""
    suggest(k)
  }
  const useFoundBinary = () => {
    source = "found"
    foundPath = foundPath || foundOf(kind)[0] || ""
  }

  $: bin = BINS[kind]
  $: pinned = view?.pinned?.[kind] || ""
  $: copies = view?.managed?.[kind] || []
  $: haveCopy = copies.includes(variant.trim() ? `${version.trim() || pinned}-${variant.trim()}` : (version.trim() || pinned))
  $: trimmed = name.trim()
  $: badName = !!trimmed && !/^[A-Za-z0-9_-]+$/.test(trimmed)
  $: clash = !editing && !!trimmed && trimmed !== wrote && !!view?.engines?.[trimmed]
  $: badPath = source === "path" && !!path.trim() && path.trim().split("/").pop() !== bin
  $: portNumber = Number(port.trim() || defaultPort(kind))
  $: badPort = !auto && (!Number.isInteger(portNumber) || portNumber < 1 || portNumber > 65535)
  $: portTaken = !auto && !!port.trim() && Object.entries(view?.engines || {})
    .some(([n, e]) => n !== (editing || wrote) && e.port === portNumber)
  $: installs = source === "managed" && !haveCopy
  $: canSave = !!trimmed && !badName && !clash && !badPath && !badPort && !portTaken && !saving && !download
    && !(source === "path" && !path.trim()) && !(source === "found" && !foundPath)
    && !(source === "managed" && cannot(kind))

  const table = () => ({
    kind,
    ...(source === "managed" ? { binary: "managed" } : {}),
    ...(source === "found" ? { binary: foundPath } : {}),
    ...(source === "path" ? { binary: path.trim() } : {}),
    ...(source === "managed" && version.trim() ? { version: version.trim() } : {}),
    ...(source === "managed" && variant.trim() ? { variant: variant.trim() } : {}),
    ...(auto ? {} : { port: portNumber }),
    // An old table's own model, kept as it was: nothing here asks for one.
    ...(current?.model ? { model: current.model } : {}),
    ...(args.trim() ? { args: split(args) } : {}),
    ...(readyTimeout.trim() ? { "ready-timeout": Number(readyTimeout) } : {}),
    // Edited, not switched: an engine that was off stays off.
    ...(current?.enabled === false ? { enabled: false } : {}),
  })

  // Until the copy is on disk: the download as the server reports it, then
  // the sheet closes.
  const follow = async () => {
    const answer = await loadEngines()
    if (answer.ok) {
      saved?.(answer.view)
      const wanted = version.trim() || pinned
      const now = (answer.view.installs || []).find(i => i.kind === kind && i.version === wanted &&
        (i.variant || "") === variant.trim())
      download = now || download
      if (now?.state === "done" || (!now && (answer.view.managed?.[kind] || []).length > copies.length)) return leave()
      if (now?.state === "failed") {
        error = now.error || "the download failed"
        download = null
        saving = false
        return
      }
    }
    polling = setTimeout(follow, 800)
  }

  const save = async () => {
    if (!canSave) return
    saving = true
    error = ""
    const engines = Object.fromEntries(
      Object.entries(view?.engines || {}).map(([n, e]) => [n, tableOf(e)]))
    engines[trimmed] = table()
    const written = await saveEngines(engines)
    if (!written.ok) {
      saving = false
      error = written.error
      return
    }
    wrote = trimmed
    saved?.(written.view)

    // The providers that send to it: a new one, or the URLs of the linked
    // ones when the port moved — each only where it still says the old URL,
    // so a URL somebody changed by hand is left alone.
    await loadProviders()
    const providers = { ...(state.providers?.providers || {}) }
    let changed = false
    if (withProvider && !providers[trimmed]) {
      providers[trimmed] = profileFor(trimmed, kind, auto ? null : portNumber)
      changed = true
    }
    // A provider sends to its engine's port whatever its URL says; this keeps
    // the file saying the same where it can.
    const before = current?.url
    const after = written.view.engines[trimmed]?.url
    for (const linked of current?.providers || []) {
      if (after && before !== after && providers[linked]?.url === before) {
        providers[linked] = { ...providers[linked], url: after }
        changed = true
      }
    }
    if (changed) {
      const result = await saveProviders({ default: state.providers?.default ?? null, providers })
      if (!result?.ok) {
        saving = false
        error = `The engine was written, and its provider was not: ${state.providersError}`
        return
      }
    }
    if (!installs) {
      saving = false
      return leave()
    }
    const started = await installEngine(kind, version.trim(), variant.trim())
    if (!started.ok) {
      saving = false
      error = `The engine was written, and its download did not start: ${started.error}`
      return
    }
    download = { state: "downloading", done: 0, total: 0 }
    follow()
  }
  const mb = n => `${(n / 1e6).toFixed(1)} MB`
  const pct = d => (d?.total ? Math.floor((100 * d.done) / d.total) : 0)
</script>

<SubModal :open="open" :title="editing ? `Engine ${editing}` : 'Add an engine'" width="46rem"
          height="min(36rem, calc(100dvh - 14rem))" @close="leave()">
  <div class="installer">
    <!-- 1. Which kind: fixed once written, so only offered when adding. -->
    <section class="step">
      <h4><span class="n">1</span> Engine</h4>
      <div class="kinds" role="radiogroup" aria-label="Engine">
        <button :each="k in KINDS" :key="k.value" type="button" role="radio" class="kind"
                :aria-checked="kind === k.value ? 'true' : 'false'"
                :disabled="(!!editing && kind !== k.value) || !offered(k.value)"
                :title="cannot(k.value) && !foundOf(k.value).length ? cannot(k.value) : ''"
                @click="chooseKind(k.value)">
          <span class="kind-head"><BrandIcon :src="brandSrc(engineBrand(k.value))" size="16px" /><strong>{{ k.name }}</strong>
            <span :if="k.note && !editing" class="tag">{{ k.note }}</span></span>
          <span class="dim small">{{ k.says }}</span>
          <span :if="cannot(k.value)" class="warn small">{{ foundOf(k.value).length ? "no release for this machine — one is installed" : cannot(k.value) }}</span>
        </button>
      </div>
    </section>

    <!-- 2. Where its binary comes from. -->
    <section class="step">
      <h4><span class="n">2</span> Binary</h4>
      <div class="sources" role="radiogroup" aria-label="Binary">
        <label class="source" :class.on="source === 'managed'" :class.off="!!cannot(kind)">
          <input type="radio" name="engine-source" :checked="source === 'managed'" :disabled="!!cannot(kind)"
                 @change="source = 'managed'">
          <span class="source-text">
            <strong>Install luu's own copy</strong>
            <span class="dim small">{{ cannot(kind) || `the official release, checked against the sha256 GitHub publishes${haveCopy ? " — already downloaded" : ""}` }}</span>
          </span>
        </label>
        <div :if="source === 'managed'" class="row">
          <InputContainer label="Version" :model="version" :placeholder="pinned"
                          description="a release tag; empty is the one luu pins" />
          <InputContainer :if="kind === 'llama'" label="Variant" :model="variant" placeholder="—"
                          description="vulkan, cuda-12.8, rocm-10.0 on Linux; empty is CPU/Metal" />
        </div>

        <label class="source" :class.on="source === 'found'" :class.off="!foundOf(kind).length">
          <input type="radio" name="engine-source" :checked="source === 'found'" :disabled="!foundOf(kind).length"
                 @change="useFoundBinary()">
          <span class="source-text">
            <strong>One this machine has</strong>
            <span class="dim small">{{ foundOf(kind).length ? `${foundOf(kind).length} found — luu runs it and never removes it` : `no ${bin} was found on this machine` }}</span>
          </span>
        </label>
        <div :if="source === 'found'" class="row">
          <InputContainer label="Binary" type="select" :options="foundOf(kind)" :model="foundPath"
                          @change="foundPath = $event.detail" />
        </div>

        <label :if="source === 'auto'" class="source on">
          <input type="radio" name="engine-source" checked @change="source = 'auto'">
          <span class="source-text">
            <strong>Whichever this machine has first</strong>
            <span class="dim small">the table names none, so <code>PATH</code> decides</span>
          </span>
        </label>

        <label class="source" :class.on="source === 'path'">
          <input type="radio" name="engine-source" :checked="source === 'path'" @change="source = 'path'">
          <span class="source-text">
            <strong>A path</strong>
            <span class="dim small">a file named <code>{{ bin }}</code>; anything else is written in <code>config.toml</code> by hand</span>
          </span>
        </label>
        <div :if="source === 'path'" class="row">
          <InputContainer label="Path" :model="path" :placeholder="`/opt/homebrew/bin/${bin}`"
                          :error="badPath ? `must be a file named ${bin}` : ''" />
        </div>
      </div>
    </section>

    <!-- 3. What it is called, and where it listens. -->
    <section class="step">
      <h4><span class="n">3</span> Where it listens</h4>
      <div class="row">
        <InputContainer label="Name" :model="name" :disabled="!!editing" placeholder="llama"
                        :error="badName ? 'letters, digits, - and _' : clash ? 'already an engine of that name' : ''" />
        <!-- The port, and inside its box whether luu chooses it. -->
        <div class="port-field">
          <InputContainer label="Port" :model="auto ? '' : port" :disabled="auto"
                          :placeholder="auto ? (placedAt ? `${placedAt} for now` : 'chosen when it starts') : String(defaultPort(kind))"
                          :error="badPort ? 'a port is 1–65535' : portTaken ? 'another engine listens there' : ''"
                          :description="auto ? 'the first free one from the kind\'s own, each time luu starts' : ''" />
          <span class="auto"><Checkbox :model="auto" label="Auto" @change="setAuto($event.detail)" /></span>
        </div>
      </div>
      <Checkbox :if="!editing" :model="withProvider" @change="withProvider = $event.detail">
        also add a provider <strong>{{ trimmed || "…" }}</strong> that starts it
      </Checkbox>
    </section>

    <details class="step advanced" :open="!!(args || readyTimeout)">
      <summary>Advanced</summary>
      <div class="row">
        <InputContainer label="Arguments" :model="args"
                        :placeholder="kind === 'llama' ? '-c 8192 -ngl 99' : ''"
                        :description="kind === 'ollama' ? 'after serve' : 'after --host, --port and the model, which luu adds; there is no shell, so ~ is not expanded'" />
        <InputContainer label="Ready within" :model="readyTimeout" placeholder="120"
                        description="seconds a session waits for it" />
      </div>
    </details>

    <div :if="download" class="downloading">
      <span>{{ download.asset || `${kind} ${version.trim() || pinned}` }}</span>
      <progress :value="download.done || 0" :max="download.total || 1"></progress>
      <span class="dim small">{{ download.state }}<span :if="download.total"> · {{ mb(download.done) }} of {{ mb(download.total) }} · {{ pct(download) }}%</span></span>
    </div>
    <p :if="error" class="error">{{ error }}</p>
  </div>

  <template :slot.foot>
    <span class="left"><Button variant="ghost" @click="leave()">Cancel</Button></span>
    <Button variant="primary" :disabled="!canSave" :loading="saving" @click="save()">
      {{ download ? "Installing…" : editing ? "Save" : installs ? "Install" : "Add engine" }}
    </Button>
  </template>
</SubModal>
