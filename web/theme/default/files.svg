<svg xmlns="http://www.w3.org/2000/svg">
  <!-- The tree's own shapes, when no `[ui] icon-theme` is named: the default
       theme's answer for a file tree, beside its tokens. Drawn rather than two
       of a font's small squares, which the first person to meet them read as a
       broken tree; since 2026-10-21 a folder open and shut and a sheet per kind
       of file — still not an icon theme: no art per language, nothing from the
       server.

       No colour here. The page fills and strokes them from the theme's tokens
       (the `luu-glyph` ones in `luu.css`, applied by `.ic.glyph` in `app.css`;
       an XML comment may not hold a double hyphen, so they are not spelt out), and
       a symbol drawn through `<use>` inherits them; a kind's symbol is a second
       path with `fill="none"`, so it takes the stroke and not the paper.
       Referenced by `glyphFor` (`web/lib/workspace.js`) as
       `./theme/default/files.svg#<id>`. See
       `RECORD/2026-10-21.the-design-system-applied.completed.md`. -->
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.8a2 2 0 0 1 1.7.9l1 1.6H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 18.5V7a1.5 1.5 0 0 1 1.5-1.5h4.1a1.5 1.5 0 0 1 1.2.6l1.2 1.4H18a1.5 1.5 0 0 1 1.5 1.5v2.2H7a1.6 1.6 0 0 0-1.5 1z"/><path d="M3 18.6l2.5-6.4A1.6 1.6 0 0 1 7 11.2h13.7a.9.9 0 0 1 .85 1.2l-2.3 6.4a1.6 1.6 0 0 1-1.5 1.05H4.4A1.4 1.4 0 0 1 3 18.6z"/></symbol>
