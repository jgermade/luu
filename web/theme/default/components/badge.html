<script :setup="{ tone = 'neutral', size = 'md', dot = false, solid = false }">
  // A short label that says what state something is in: `ready`, `3 changed`,
  // `remote`. `tone` is the state — `neutral`, `accent`, `ok`, `warn`, `bad` —
  // drawn as the tone's ink on its soft ground, or filled with `solid`. `dot`
  // puts a dot of the tone before the text, for a status read at a glance.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Badge tone="ok" dot>ready</Badge>
  //   <Badge tone="accent" solid size="sm">new</Badge>

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: hasDot = flag(dot)
  $: isSolid = flag(solid)
</script>

<span class="badge"
      :class.tone-accent="tone === 'accent'"
      :class.tone-ok="tone === 'ok'"
      :class.tone-warn="tone === 'warn'"
      :class.tone-bad="tone === 'bad'"
      :class.solid="isSolid"
      :class.sm="size === 'sm'"
      :class.lg="size === 'lg'">
  <span :if="hasDot" class="dot" aria-hidden="true"></span>
  <slot></slot>
</span>
