<script :setup="{
  model = false,
  disabled = false,
  size = 'md',
  label = '',
  description = ''
}">
  // On or off, and in force as soon as it moves: a setting, not a field in a
  // form that is saved later — that is a `Checkbox`.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Switch :model="autoName" label="Name sessions" description="from their first prompt" />
  //
  // A `role="switch"` button: Space and Enter flip it. The value goes up
  // through `:model` and as `change`; one fixed on is `model="true"`.

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)

  $: on = flag(model)

  const flip = () => {
    if (isDisabled) return
    $updateModel(!on)
    $emit("change", !on)
  }
</script>

<span class="switch" :class.sm="size === 'sm'" :class.disabled="isDisabled">
  <button type="button"
          role="switch"
          class="track"
          :class.on="on"
          :aria-checked="on ? 'true' : 'false'"
          :aria-label="label || null"
          :disabled="isDisabled"
          @click="flip()">
    <span class="thumb" aria-hidden="true"></span>
  </button>
  <span :if="label || description" class="text" @click="flip()">
    <span :if="label" class="label">{{ label }}</span>
    <span :if="description" class="description">{{ description }}</span>
  </span>
</span>

  .track:active:not(:disabled) .thumb { transform: scale(.85); }
  .track.on:active:not(:disabled) .thumb { transform: translateX(calc(var(--w) - var(--h))) scale(.85); }
