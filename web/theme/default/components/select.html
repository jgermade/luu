<script :setup="{
  model = '',
  options = [],
  placeholder = '',
  size = 'md',
  disabled = false,
  invalid = false,
  warn = false,
  selectClass = '',
  id = '',
  name = '',
  label = ''
}">
  // One answer out of a list too long for a `ChoiceSegmented`, as the platform's
  // own `<select>`: its menu, its keyboard, its behaviour on a phone. Only the
  // closed box is drawn here.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Select :model="backend" :options="['ollama', 'openai', 'mock']" />
  //   <Select :model="provider" placeholder="choose one">
  //     <option :each="p in providers" :key="p" :value="p">{{ p }}</option>
  //   </Select>
  //
  // An option is a string or `{ value, label, disabled, title }`. The choice
  // goes up through `:model` and as `change`, in `$event.detail`. `warn` is a
  // border in the warning tone. `selectClass` names the `<select>` itself, for
  // a caller — or a test — that addresses it.

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)
  $: isInvalid = flag(invalid)
  $: isWarn = flag(warn)

  $: items = options.map(o => typeof o === "string" ? { value: o, label: o } : o)
  $: val = model ?? ""

  const chosen = event => {
    const v = event.target.value
    $updateModel(v)
    $emit("change", v)
  }
</script>

<div class="select"
     :class.sm="size === 'sm'"
     :class.lg="size === 'lg'"
     :class.invalid="isInvalid"
     :class.warned="isWarn && !isInvalid"
     :class.disabled="isDisabled"
     :class.unset="!val">
  <select :class="selectClass || null"
          :value="val"
          :disabled="isDisabled"
          :id="id || null"
          :name="name || null"
          :aria-label="label || null"
          :aria-invalid="isInvalid ? 'true' : null"
          @change="chosen($event)">
    <option :if="placeholder" value="" disabled :selected="!val">{{ placeholder }}</option>
    <option :each="item in items"
            :key="String(item.value)"
            :value="item.value"
            :disabled="item.disabled"
            :title="item.title || null">{{ item.label }}</option>
    <slot></slot>
  </select>
  <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
</div>
