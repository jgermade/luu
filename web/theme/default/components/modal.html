<script :setup="{ open = false, title = '', width = '32rem', height = '', dismissible = true, head = 'auto', align = 'center' }">
  // A view over the page that has to be answered or left before the page is
  // used again. The platform's `<dialog>`, opened with `showModal()`: ESC, the
  // focus held inside, the page behind made inert, and a backdrop.
  //
  // **Part of the default theme**: imports only the theme's own `Scrollable`,
  // which its body scrolls through, and draws only with `tokens.css`. See
  // `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Modal :open="asking" title="Delete this session?" @close="asking = false">
  //     Its stream goes with it.
  //     <template :slot.foot>
  //       <Button @click="asking = false">Keep it</Button>
  //       <Button variant="danger" @click="remove()">Delete</Button>
  //     </template>
  //   </Modal>
  //
  // **The owner decides whether it closes.** ESC, a click on the backdrop and
  // the close button only emit `close`; it closes when `:open` goes false, and
  // plays its way out first. `dismissible` false refuses all three and hides
  // the close button — for a question with no way back. `width` is a length,
  // capped at the window; `height` too, for a modal as tall as a page (Settings
  // is one), whose body takes the room between the head and the foot.
  // `align="top"` hangs it from near the window's top instead of centring it,
  // for one whose body grows as it is answered: centred, everything above
  // what grew would move up under the pointer.
  //
  // **The head follows the size**: a large modal — 40rem and up, as drawn —
  // has a dark head, a bar like the page's own, and a small one has a head
  // that is part of its body. `head` is `auto` for that, or `dark` or
  // `integrated` to say it outright. The dark head is a `data-tone="dark"`
  // island, so it draws with the theme's own dark values.
  //
  // **Or a head in a tone**, whatever the size: `accent`, `ok`, `warn` or
  // `bad` is the same bar in that tone's strong colour, with the ink a solid
  // `Badge` has on it — what the dialog is about said before it is read.
  //
  //   <Modal :open="removing" title="Remove workstation?" head="bad" …>

  const Scrollable = await import("./scrollable.html")

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isOpen = flag(open)
  $: isDismissible = flag(dismissible)

  let leaving = false
  // How wide it was drawn, measured each time it opens: a modal asked for at
  // 40rem on a phone is a small one there.
  const LARGE = 640
  let wide = false
  $: dark = head === "dark" || (head === "auto" && wide)
  const TONES = ["accent", "ok", "warn", "bad"]
  $: tone = TONES.includes(head) ? head : null

  // How long the way out is, from the token, so reduced motion is no wait.
  const exit = () => {
    const ms = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--luu-duration"))
    return Number.isFinite(ms) ? ms : 0
  }

  const show = () => {
    const dialog = $self("dialog")
    if (!dialog || dialog.open) return
    leaving = false
    dialog.showModal()
    wide = dialog.offsetWidth >= LARGE
  }
  const hide = () => {
    const dialog = $self("dialog")
    if (!dialog?.open || leaving) return
    const ms = exit()
    if (!ms) return dialog.close()
    leaving = true
    setTimeout(() => { dialog.close(); leaving = false }, ms)
  }

  const ask = () => {
    if (isDismissible) $emit("close")
  }
  // ESC is the platform's, and it would close the dialog behind the owner's
  // back; it becomes a request like the others.
  const cancel = event => {
    event.preventDefault()
    ask()
  }
  // A click whose target is the dialog itself landed on the backdrop: the
  // content fills the box, so anything inside has a target of its own.
  const backdrop = event => {
    if (event.target === event.currentTarget) ask()
  }

  await $mounted()
  $: isOpen ? requestAnimationFrame(show) : hide()
</script>

        :aria-label="title || null"
        @cancel="cancel($event)"
        @click="backdrop($event)">

    <header :if="title || isDismissible" class="head" :class.dark="dark"
            :class.toned="!!tone"
            :class.tone-accent="tone === 'accent'"
            :class.tone-ok="tone === 'ok'"
            :class.tone-warn="tone === 'warn'"
            :class.tone-bad="tone === 'bad'"
            :data-tone="dark ? 'dark' : null">
      <h2 class="title">{{ title }}</h2>
      <button :if="isDismissible" type="button" class="close" title="Close" @click="ask()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </header>
    <div class="body"><Scrollable y fill><div class="content"><slot></slot></div></Scrollable></div>
    <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
  </div>
</dialog>
