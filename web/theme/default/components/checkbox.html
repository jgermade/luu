<script :setup="{
  model = false,
  indeterminate = false,
  disabled = false,
  label = '',
  description = '',
  id = '',
  name = ''
}">
  // Yes or no about one thing, said by ticking it. For a setting that takes
  // effect at once, a `Switch` reads better; this is for a choice inside a
  // form that is saved later, or for picking several items from a list.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Checkbox :model="isDefault" label="Default" description="what a run with no -p sends to" />
  //   <Checkbox :model="all" :indeterminate="some">select all</Checkbox>
  //
  // `indeterminate` is *some of them*, drawn as a dash; a click resolves it to
  // checked. The value goes up through `:model` and as `change`; a box that
  // is fixed on is `model="true"` — jq79 never hands `:checked` to a
  // component.

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)
  $: isMixed = flag(indeterminate)

  $: on = flag(model) || model === 1

  const toggled = event => {
    const v = event.target.checked
    $updateModel(v)
    $emit("change", v)
  }

  await $mounted()
  // A property, not an attribute: there is no markup for it.
  $: (() => { const box = $self("input"); if (box) box.indeterminate = isMixed && !on })()
</script>

<label class="check" :class.disabled="isDisabled" :class.on="on" :class.mixed="isMixed && !on">
  <input type="checkbox"
         :checked="on"
         :disabled="isDisabled"
         :id="id || null"
         :name="name || null"
         @change="toggled($event)">
  <span class="box" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path class="tick" d="M5 12.5l4.5 4.5L19 7" />
      <path class="dash" d="M6 12h12" />
    </svg>
  </span>
  <span :if="label || description || $slots.default" class="text">
    <span :if="label" class="label">{{ label }}</span>
    <slot></slot>
    <span :if="description" class="description">{{ description }}</span>
  </span>
</label>
