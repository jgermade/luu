<script :setup="{
  model = '',
  type = 'text',
  options = [],
  label = '',
  description = '',
  error = '',
  warning = '',
  placeholder = '',
  list = '',
  selectClass = '',
  disabled = false,
  required = false,
  id = '',
  name = ''
}">
  // One control and what is said about it, in one box: its name inside the
  // border, at the top; the control filling the box under it, borderless —
  // the name is drawn over the control, so all of the box is it; what it is for
  // under the box, or what is wrong with it in place of that. `type="select"`
  // makes the control a `<select>` of `options`; anything else is an
  // `<input>` of that type.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <InputContainer label="URL" description="where the server listens"
  //                   :model="url" placeholder="http://127.0.0.1:11434" />
  //   <InputContainer label="Backend" type="select" :options="BACKENDS" :model="backend" />
  //
  // Where `Field` puts a name above any control, this *is* the control: the
  // whole box is what is clicked and what is focused. An option is a string or
  // `{ value, label, disabled, title }`. The value goes up through `:model`,
  // and as `input` (each keystroke) and `change` (committed), in
  // `$event.detail`. `warning` is said where the description is, in the warning
  // tone — *this will not do what you think* — where `error` is *this is
  // wrong*. `list` is a `<datalist>`'s id, for suggestions a text field still
  // lets a person type past; `selectClass` names the `<select>` itself.

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)
  $: isRequired = flag(required)

  $: isSelect = type === "select"
  $: items = options.map(o => typeof o === "string" ? { value: o, label: o } : o)
  $: val = model ?? ""
  // The description is the control's, for a screen reader as for an eye.
  const said = `luu-said-${Math.random().toString(36).slice(2, 9)}`

  const typed = event => {
    const v = event.target.value
    $updateModel(v)
    $emit("input", v)
  }
  const committed = event => {
    const v = event.target.value
    if (isSelect) $updateModel(v)
    $emit("change", v)
  }
</script>

<div class="container">
  <label class="box"
         :class.has-problem="!!error"
         :class.has-warning="!error && !!warning"
         :class.off="isDisabled"
         :class.named="!!label">
    <span :if="label" class="name">
      {{ label }}<span :if="isRequired" class="mark" aria-hidden="true">*</span>
    </span>
    <input :if="!isSelect"
           :type="type"
           :value="val"
           :placeholder="placeholder || null"
           :disabled="isDisabled"
           :required="isRequired"
           :id="id || null"
           :name="name || null"
           :list="list || null"
           :aria-invalid="error ? 'true' : null"
           :aria-describedby="error || warning || description ? said : null"
           @input="typed($event)"
           @change="committed($event)">
    <select :if="isSelect"
            :class="selectClass || null"
            :value="val"
            :disabled="isDisabled"
            :required="isRequired"
            :id="id || null"
            :name="name || null"
            :aria-invalid="error ? 'true' : null"
            :aria-describedby="error || warning || description ? said : null"
            @change="committed($event)">
      <option :if="placeholder" value="" disabled :selected="!val">{{ placeholder }}</option>
      <option :each="item in items" :key="String(item.value)"
              :value="item.value" :disabled="item.disabled"
              :title="item.title || null">{{ item.label }}</option>
    </select>
    <svg :if="isSelect" class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
  </label>
  <p :if="error" class="said problem" :id="said" role="alert">{{ error }}</p>
  <p :if="!error && warning" class="said warning" :id="said">{{ warning }}</p>
  <p :if="!error && !warning && description" class="said" :id="said">{{ description }}</p>
</div>
