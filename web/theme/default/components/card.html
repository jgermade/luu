<script :setup="{ title = '', subtitle = '', padded = true, interactive = false }">
  // A surface that groups one thing: a provider, an engine, a runtime. A head
  // when there is a `title` or something in the `actions` slot, the content,
  // and a foot when the `foot` slot has something.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Card title="workstation" subtitle="ollama · 192.168.1.20">
  //     <template :slot.actions><Button size="sm">edit</Button></template>
  //     …
  //     <template :slot.foot>…</template>
  //   </Card>
  //
  // `interactive` is a card that is itself the thing to click: it lifts on
  // hover and emits `click`. A card with buttons in it is not one.

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isInteractive = flag(interactive)
  $: isPadded = flag(padded)

  const click = event => {
    if (isInteractive) $emit("click", event)
  }
  const key = event => {
    if (!isInteractive || (event.key !== "Enter" && event.key !== " ")) return
    event.preventDefault()
    $emit("click", event)
  }
</script>

<section class="card"
         :class.interactive="isInteractive"
         :tabindex="isInteractive ? 0 : null"
         :role="isInteractive ? 'button' : null"
         @click="click($event)"
         @keydown="key($event)">
  <header :if="title || $slots.actions" class="head">
    <div class="titles">
      <h3 :if="title" class="title">{{ title }}</h3>
      <p :if="subtitle" class="subtitle">{{ subtitle }}</p>
    </div>
    <div :if="$slots.actions" class="actions"><slot.actions /></div>
  </header>
  <div class="body" :class.padded="isPadded"><slot></slot></div>
  <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
</section>
