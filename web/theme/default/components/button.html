<script :setup="{
  variant = 'secondary',
  size = 'md',
  type = 'button',
  disabled = false,
  loading = false,
  block = false,
  square = false,
  title = '',
  label = ''
}">
  // A button. `variant` is what it does to the page: `primary` is the one
  // thing a view asks for, `secondary` the rest, `ghost` an action that should
  // not compete with content, `danger` one that loses something.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Button variant="primary" @click="save()">Save</Button>
  //   <Button square title="Close" @click="close()"><svg …/></Button>
  //   <Button :loading="saving">Saving</Button>
  //
  // **`click` is re-emitted**, with the native event in `$event.detail`: jq79
  // binds `@click` on a component to its `$emit` and nothing else. It is not
  // emitted while disabled or loading. `square` is for an icon alone, and
  // then `title` is its name — `label` is the same thing for a screen reader
  // when the tooltip would be noise. An icon is sized by whoever writes it: a
  // scoped style does not reach what arrives through a slot.

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)
  $: isLoading = flag(loading)
  $: isBlock = flag(block)
  $: isSquare = flag(square)

  const click = event => {
    if (isDisabled || isLoading) return
    $emit("click", event)
  }
</script>

<button class="btn"
        :type="type"
        :class.primary="variant === 'primary'"
        :class.ghost="variant === 'ghost'"
        :class.danger="variant === 'danger'"
        :class.sm="size === 'sm'"
        :class.lg="size === 'lg'"
        :class.block="isBlock"
        :class.square="isSquare"
        :class.loading="isLoading"
        :disabled="isDisabled"
        :aria-busy="isLoading ? 'true' : null"
        :aria-label="label || null"
        :title="title || null"
        @click="click($event)">
  <span :if="isLoading" class="spin" aria-hidden="true"></span>
  <span class="content"><slot></slot></span>
</button>
