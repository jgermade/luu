<script :setup="{ items = [], label = 'On this page', model = '', offset = 96 }">
  // The sections of a page, as links, with the one being read marked as the
  // page scrolls. The sections are anything with those ids — a `Section` is
  // one — wherever they are.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <AnchorNav :items="[{ id: 'models', label: 'Models' }, 'engines']" />
  //
  // An item is `{ id, label }`, or a string that is both. **The one being
  // read** is the last whose top has passed `offset` pixels from the top of
  // the window — the height of a sticky head, if the page has one — and at the
  // very bottom of what scrolls it is the last, however short, or a short last
  // section could never be reached. It is followed in whatever scrolls the
  // sections — the window, or the first box around them with an `overflow` of
  // its own, from whose top `offset` is then measured — and in nothing else,
  // so two of these on one page do not answer each other's scrolling. The id
  // goes up through `:model` and as `change`.

  $: links = items.map(item => typeof item === "string" ? { id: item, label: item } : item)

  let current = model || ""
  const mark = id => {
    if (!id || id === current) return
    current = id
    $updateModel(id)
    $emit("change", id)
    requestAnimationFrame(keepInView)
  }

  // The list scrolls on its own when it is taller than its room — and only
  // the list. Not `scrollIntoView`, which scrolls *every* box around the link
  // to show it, the window included: a nav marking its first item on load
  // took the page down to wherever the nav was.
  const keepInView = () => {
    const on = $self("a.on")
    const box = scrollerOf(on)
    if (!on || !box || box === scroller) return
    const link = on.getBoundingClientRect()
    const room = box.getBoundingClientRect()
    if (link.top < room.top) box.scrollTop -= room.top - link.top
    else if (link.bottom > room.bottom) box.scrollTop += link.bottom - room.bottom
  }

  // The window, or the box the sections scroll in.
  let scroller = null
  const scrollerOf = element => {
    for (let at = element?.parentElement; at && at !== document.body; at = at.parentElement) {
      const y = getComputedStyle(at).overflowY
      if (y === "auto" || y === "scroll") return at
    }
    return null
  }

  const spy = () => {
    if (!links.length) return
    const line = (scroller ? scroller.getBoundingClientRect().top : 0) + (Number(offset) || 0)
    let on = links[0].id
    for (const link of links) {
      const top = document.getElementById(link.id)?.getBoundingClientRect().top
      // A pixel of give: a section scrolled to the line lands on it to within
      // a fraction, and that fraction is not "below".
      if (top !== undefined && top < line + 1) on = link.id
    }
    const end = scroller
      ? scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2
      : window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2
    // Only where it has scrolled at all: a page shorter than its window is
    // "at the bottom" from the start.
    const moved = scroller ? scroller.scrollTop > 0 : window.scrollY > 0
    if (end && moved) on = links[links.length - 1].id
    mark(on)
  }

  // At most once a frame.
  let queued = null
  const onScroll = () => {
    if (queued) return
    queued = requestAnimationFrame(() => {
      queued = null
      spy()
    })
  }

  // A click scrolls to the section over `--luu-duration-scroll` — not the
  // platform's smooth scrolling, whose length is the browser's to choose — and
  // says so at once. It keeps saying the one clicked, even one too short to
  // reach the line, until something scrolls away from where it landed; the
  // scrolling it does itself is not that. The address gets the `#id`, as a
  // link's would, and a click with a modifier is left to the browser.
  let pinned = false
  let landed = null
  let gliding = false
  const position = () => scroller ? scroller.scrollTop : window.scrollY
  const scrollTo = y => scroller ? (scroller.scrollTop = y) : window.scrollTo(0, y)
  const furthest = () => scroller
    ? scroller.scrollHeight - scroller.clientHeight
    : document.documentElement.scrollHeight - window.innerHeight
  const glide = ms => {
    const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(ms))
    return Number.isFinite(value) ? value : 0
  }
  // Fast, then settling: `--luu-ease-out`'s shape, as a function of time.
  const settle = t => 1 - Math.pow(1 - t, 3)

  const go = (event, id) => {
    const target = document.getElementById(id)
    if (!target || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return
    event.preventDefault()
    pinned = true
    landed = null
    mark(id)
    const margin = parseFloat(getComputedStyle(target).scrollMarginTop) || 0
    const top = scroller ? scroller.getBoundingClientRect().top : 0
    const from = position()
    const to = Math.max(0, Math.min(furthest(), from + target.getBoundingClientRect().top - top - margin))
    const done = () => {
      gliding = false
      landed = position()
      if (location.hash !== `#${id}`) history.pushState(null, "", `#${id}`)
    }
    const duration = glide("--luu-duration-scroll")
    if (!duration || from === to) {
      scrollTo(to)
      return done()
    }
    gliding = true
    const start = performance.now()
    const step = now => {
      const t = Math.min(1, (now - start) / duration)
      scrollTo(from + (to - from) * settle(t))
      if (t < 1) requestAnimationFrame(step)
      else done()
    }
    requestAnimationFrame(step)
  }
  const onScrollAfterClick = () => {
    if (gliding) return
    if (pinned) {
      if (landed === null || Math.abs(position() - landed) < 2) return
      pinned = false
    }
    onScroll()
  }

  await $mounted()
  // A frame later, when the sections are laid out wherever they are.
  requestAnimationFrame(() => {
    scroller = scrollerOf(document.getElementById(links[0]?.id))
    ;(scroller ?? window).addEventListener("scroll", onScrollAfterClick, { passive: true })
    spy()
  })
  window.addEventListener("resize", onScroll)
  $destroyed(() => {
    ;(scroller ?? window).removeEventListener("scroll", onScrollAfterClick)
    window.removeEventListener("resize", onScroll)
    if (queued) cancelAnimationFrame(queued)
  })
</script>

<nav class="anchors" :aria-label="label || null">
  <a :each="link in links"
     :key="link.id"
     :href="`#${link.id}`"
     :class.on="link.id === current"
     :aria-current="link.id === current ? 'location' : null"
     @click="go($event, link.id)">{{ link.label }}</a>
</nav>

    /* Square on the side the bar is, so the bar runs straight down the edge;
