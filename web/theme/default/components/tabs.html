<script :setup="{ items = [], model = '', label = '', size = 'md' }">
  // Views of one thing, one at a time: a turn's context, its answer, its
  // calls. Only the strip is drawn here; the owner shows the panel that
  // `model` names, so a panel can be anything and can stay mounted or not.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Tabs label="Turn" :model="tab" :items="[
  //     { value: 'context', label: 'Context', count: 7 }, 'answer', 'calls',
  //   ]" />
  //   <section :if="tab === 'context'">…</section>
  //
  // An item is a string or `{ value, label, count, disabled }`; `count` is a
  // small number beside the label. The arrows, Home and End move between
  // tabs and choose as they go. The choice goes up through `:model` and as
  // `change`. A line under the chosen tab slides to the next.

  $: tabs = items.map(t => typeof t === "string" ? { value: t, label: t } : t)
  $: open = tabs.filter(t => !t.disabled)

  let at = null
  let moving = false
  const place = () => {
    const on = $self("button.on")
    if (!on || !on.offsetWidth) return
    at = { x: on.offsetLeft, w: on.offsetWidth }
    if (!moving) requestAnimationFrame(() => { moving = true })
  }

  const choose = tab => {
    if (tab.disabled || tab.value === model) return
    $updateModel(tab.value)
    $emit("change", tab.value)
  }

  const STEP = { ArrowRight: 1, ArrowLeft: -1 }
  const key = (e, tab) => {
    const i = open.indexOf(tab)
    const next =
      e.key === "Home" ? open[0] :
      e.key === "End" ? open[open.length - 1] :
      e.key in STEP ? open[(i + STEP[e.key] + open.length) % open.length] :
      null
    if (!next) return
    e.preventDefault()
    choose(next)
    $self(".tabs").querySelectorAll("button")[tabs.indexOf(next)]?.focus()
  }

  await $mounted()
  const sizes = new ResizeObserver(() => place())
  sizes.observe($self(".tabs"))
  $destroyed(() => sizes.disconnect())
  $: (model, tabs, requestAnimationFrame(place))
  $: line = at ? `width:${at.w}px;transform:translateX(${at.x}px)` : "display:none"
</script>

<div class="tabs" role="tablist" :aria-label="label || null"
     :class.sm="size === 'sm'" :class.moving="moving">
  <button :each="tab in tabs"
          :key="String(tab.value)"
          type="button"
          role="tab"
          :aria-selected="tab.value === model ? 'true' : 'false'"
          :tabindex="tab.value === model ? 0 : -1"
          :class.on="tab.value === model"
          :disabled="tab.disabled"
          @click="choose(tab)"
          @keydown="key($event, tab)">
    {{ tab.label }}
    <span :if="tab.count !== undefined && tab.count !== null" class="count">{{ tab.count }}</span>
  </button>
  <span class="line" :style="line" aria-hidden="true"></span>
</div>
