<script :setup="{
  open = false,
  title = '',
  tabs = [],
  model = '',
  width = '40rem',
  height = '',
  dismissible = true
}">
  // A modal inside a modal: a sheet that comes down out of its parent's head
  // and covers the parent's body only — the parent's head stays lit, so it is
  // still clear whose form this is, and its close button still closes both.
  // With `tabs`, its head is a strip of them, as `TabModal`'s is.
  //
  // **Part of the default theme**: imports only the theme's own `Scrollable`,
  // which its body scrolls through, and draws only with `tokens.css`. See
  // `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Modal :open="editing" title="workstation" @close="editing = false">
  //     …
  //     <SubModal :open="adding" title="Add a model" @close="adding = false">
  //       …
  //       <template :slot.foot><Button variant="primary">Add</Button></template>
  //     </SubModal>
  //   </Modal>
  //
  // Written anywhere inside the parent `Modal` or `TabModal`. **Opened with
  // `show()`, not `showModal()`**: a second modal would make everything under
  // it inert, the parent's head included. What the top layer would have done
  // is done here: the rest of the parent is made `inert`, a veil covers the
  // parent's body and asks to close when clicked, and ESC is caught before it
  // reaches the parent, so it closes this one alone. As with the others, ESC,
  // the veil and the close button only emit `close`; the owner closes it with
  // `:open`. A tab is a string or `{ value, label, count, disabled }`, chosen
  // through `:model` and as `change`; the owner shows the panel it names.
  //
  // **Narrower than its parent**, and centred under its head: `width` (40rem)
  // at most, and always 1.5rem in from each side, so it reads as a sheet laid
  // over the parent and not as the parent's body changing.

  const Scrollable = await import("./scrollable.html")

  // A bare attribute (`<X dismissible>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isOpen = flag(open)
  $: isDismissible = flag(dismissible)

  const uid = `luu-sub-${Math.random().toString(36).slice(2, 9)}`
  const tabId = value => `${uid}-tab-${String(value).replace(/[^\w-]/g, "_")}`
  $: list = tabs.map(t => typeof t === "string" ? { value: t, label: t } : t)
  $: usable = list.filter(t => !t.disabled)

  // ---- where it goes ---------------------------------------------------------

  // The parent dialog, and the parent's body in the viewport's pixels.
  let parent = null
  let room = null
  const fit = () => {
    if (!parent?.open) return
    const outer = parent.getBoundingClientRect()
    // The parent's head is its first header: the one before its body, where
    // this is written.
    const head = parent.querySelector("header")?.getBoundingClientRect()
    const top = head ? head.bottom : outer.top
    // The parent's lower corners, so the veil rounds where the parent does —
    // read from it, so a parent of another radius is followed too.
    const style = getComputedStyle(parent)
    room = {
      top, left: outer.left, width: outer.width, height: outer.bottom - top,
      corners: `0 0 ${style.borderBottomRightRadius} ${style.borderBottomLeftRadius}`,
    }
  }
  // The veil covers the parent's body; the sheet starts where it does and is
  // as tall as its content, up to that.
  $: covered = room
    ? `top:${room.top}px;left:${room.left}px;width:${room.width}px;height:${room.height}px;border-radius:${room.corners}`
    : "display:none"
  // In CSS rather than here, so `width` can be any length: the narrower of
  // it and the parent less 1.5rem a side, centred on the parent.
  const sheetFor = (at, wide) => {
    if (!at) return ""
    const w = `min(${wide}, ${at.width}px - 3rem)`
    return `top:${at.top}px;left:calc(${at.left}px + (${at.width}px - ${w}) / 2);width:${w};max-height:${at.height}px`
  }
  $: sheet = sheetFor(room, width)

  // What `inert` was put on, to give back: at each level from this up to the
  // parent, the siblings that are not on the way — but the parent's head.
  let veiled = []
  const veil = from => {
    for (let at = from; at && at !== parent; at = at.parentElement) {
      for (const sibling of at.parentElement?.children || []) {
        if (sibling === at || sibling.inert) continue
        if (sibling.tagName === "HEADER" && sibling.parentElement?.closest("dialog") === parent) continue
        sibling.inert = true
        veiled.push(sibling)
      }
    }
  }
  const unveil = () => {
    for (const element of veiled) element.inert = false
    veiled = []
  }

  // ESC, on the window and before anything else: the parent is the modal, and
  // its `cancel` would close it. Taken here, it closes this one.
  const escape = event => {
    if (event.key !== "Escape" || !$self("dialog")?.open) return
    event.preventDefault()
    event.stopPropagation()
    ask()
  }

  // ---- open and close --------------------------------------------------------

  let leaving = false
  const exit = () => {
    const ms = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--luu-duration"))
    return Number.isFinite(ms) ? ms : 0
  }
  const show = () => {
    const dialog = $self("dialog")
    if (!dialog || dialog.open) return
    parent = dialog.parentElement?.closest("dialog[open]") ?? null
    leaving = false
    fit()
    veil($self(".sub-root"))
    dialog.show()
    window.addEventListener("keydown", escape, true)
    parent?.addEventListener("close", parentClosed)
    requestAnimationFrame(() => {
      placeLine()
      const first = $self("button[role=tab].on") ||
        // `:scope >`: a selector is matched against the whole document, and
        // the parent's own `.body` is an ancestor of everything in here.
        dialog.querySelector(":scope > .body :is(input, select, textarea, button):not(:disabled)")
      first?.focus()
    })
  }
  const done = () => {
    const dialog = $self("dialog")
    dialog?.close()
    leaving = false
    unveil()
    window.removeEventListener("keydown", escape, true)
    parent?.removeEventListener("close", parentClosed)
  }
  // The parent closed under it — its own close button is lit, and closes both.
  // This one goes at once, gives back what it made inert, and tells its owner,
  // so a parent opened again does not open with this still in it.
  //
  // The parent's own `close` only: a component's `$emit("close")` bubbles, and
  // this one's, asking its owner to close it, reaches the parent dialog under
  // the same name — taken for the parent's, it closed the sheet at once, and
  // its way out never played.
  const parentClosed = event => {
    if (event.target !== parent) return
    done()
    $emit("close")
  }
  const hide = () => {
    const dialog = $self("dialog")
    if (!dialog?.open || leaving) return
    const ms = exit()
    if (!ms) return done()
    leaving = true
    setTimeout(done, ms)
  }
  const ask = () => {
    if (isDismissible) $emit("close")
  }

  // ---- the tabs, when it has them ------------------------------------------

  let at = null
  let moving = false
  const placeLine = () => {
    const on = $self("button[role=tab].on")
    if (!on || !on.offsetWidth) return
    at = { x: on.offsetLeft, w: on.offsetWidth }
    if (!moving) requestAnimationFrame(() => { moving = true })
  }
  const choose = tab => {
    if (tab.disabled || tab.value === model) return
    $updateModel(tab.value)
    $emit("change", tab.value)
    const body = $self(".body [data-scrollable]")
    if (body) body.scrollTop = 0
  }
  const STEP = { ArrowRight: 1, ArrowLeft: -1 }
  const key = (e, tab) => {
    const i = usable.indexOf(tab)
    const next =
      e.key === "Home" ? usable[0] :
      e.key === "End" ? usable[usable.length - 1] :
      e.key in STEP ? usable[(i + STEP[e.key] + usable.length) % usable.length] :
      null
    if (!next) return
    e.preventDefault()
    choose(next)
    $self(`#${tabId(next.value)}`)?.focus()
  }

  await $mounted()
  window.addEventListener("resize", fit)
  $destroyed(() => {
    window.removeEventListener("resize", fit)
    window.removeEventListener("keydown", escape, true)
    unveil()
  })
  $: isOpen ? requestAnimationFrame(show) : hide()
  $: (model, list, requestAnimationFrame(placeLine))
  $: line = at ? `width:${at.w}px;transform:translateX(${at.x}px)` : "display:none"
</script>

<div class="sub-root">
  <div class="veil" :class.shown="isOpen || leaving" :class.leaving="leaving" :style="covered"
       @click="ask()"></div>
  <dialog class="sub" :class.leaving="leaving" :style="sheet" :aria-label="title || null">
    <header class="head" :class.tabbed="list.length > 0">
      <span class="bullet" aria-hidden="true"></span>
      <strong :if="title" class="title">{{ title }}</strong>
      <div :if="list.length" class="strip" role="tablist" :aria-label="title || null" :class.moving="moving">
        <button :each="tab in list"
                :key="String(tab.value)"
                type="button"
                role="tab"
                :id="tabId(tab.value)"
                :aria-selected="tab.value === model ? 'true' : 'false'"
                :aria-controls="`${uid}-panel`"
                :tabindex="tab.value === model ? 0 : -1"
                :class.on="tab.value === model"
                :disabled="tab.disabled"
                @click="choose(tab)"
                @keydown="key($event, tab)">
          {{ tab.label }}
          <span :if="tab.count !== undefined && tab.count !== null" class="count">{{ tab.count }}</span>
        </button>
        <span class="line" :style="line" aria-hidden="true"></span>
      </div>
      <button :if="isDismissible" type="button" class="close" title="Close" @click="ask()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </header>
    <div class="body" :id="`${uid}-panel`"
         :role="list.length ? 'tabpanel' : null"
         :aria-labelledby="list.length && model ? tabId(model) : null"
         :style="height ? `flex:none;height:${height}` : ''">
      <Scrollable y fill><div class="content"><slot></slot></div></Scrollable>
    </div>
    <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
  </dialog>
</div>

<style scoped>

  .veil {
    position: fixed;
    z-index: 15;
    display: none;
    background: var(--luu-overlay);
    backdrop-filter: blur(2px);
  }
  .veil.shown { display: block; animation: fade var(--luu-duration) ease; }
  /* The way out is keyframes of its own, not `fade` reversed: an animation
     whose name stays the same is not started again, only turned round — and
     one that has finished, turned round, is at its start at once. */
  .veil.leaving { animation: fade-out var(--luu-duration) ease forwards; }

  /* A sheet: the width of the parent, from under its head down, as far as its
     content goes. */
  .sub {

    border: 0;
    background: transparent;

  }
  .sub[open] {

  }

  @keyframes sheet { from { opacity: 0; transform: translateY(-24px); } }
  @keyframes sheet-out { to { opacity: 0; transform: translateY(-16px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes fade-out { to { opacity: 0; } }

  /* The sheet itself: its own edge on three sides, none along the top — it

  .head, .body, .foot {

    border-inline: var(--luu-border-width) solid var(--luu-border);
  }
  .sub > :last-child {

    border-radius: 0 0 var(--luu-radius-lg) var(--luu-radius-lg);

  }

  .head {
    display: flex;
    align-items: center;
    gap: var(--luu-space-2);
    padding: var(--luu-space-3) var(--luu-space-3) var(--luu-space-2) var(--luu-space-5);
  }

  /* A frame and a `Scrollable`; the content pads itself, so the padding
