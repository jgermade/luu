<script :setup="{
  options = [],
  model = '',
  name = '',
  label = '',
  disabled = false,
  direction = 'column'
}">
  // One answer out of a few, each worth a line of explanation — where a
  // `Segmented` would have to cut the explanation off. Native radios, so the
  // arrows, Tab and a screen reader behave as everywhere else.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <RadioGroup label="Host shell" :model="host" :options="[
  //     { value: 'loopback', label: 'loopback', description: 'only from this machine' },
  //     { value: 'always', label: 'always', description: 'whoever holds the token' },
  //   ]" />
  //
  // An option is a string or `{ value, label, description, disabled }`.
  // `direction` is `column` or `row`. The choice goes up through `:model` and
  // as `change`.

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)

  $: items = options.map(o => typeof o === "string" ? { value: o, label: o } : o)
  $: val = model
  // Radios are a group by name; one nobody gave is one nobody else has.
  const group = name || `luu-radio-${Math.random().toString(36).slice(2, 9)}`

  const choose = item => {
    $updateModel(item.value)
    $emit("change", item.value)
  }
</script>

<div class="group" role="radiogroup" :aria-label="label || null"
     :class.row="direction === 'row'" :class.disabled="isDisabled">
  <label :each="item in items" :key="String(item.value)" class="option"
         :class.on="item.value === val" :class.off="isDisabled || item.disabled">
    <input type="radio"
           :name="group"
           :value="String(item.value)"
           :checked="item.value === val"
           :disabled="isDisabled || item.disabled"
           @change="choose(item)">
    <span class="dot" aria-hidden="true"></span>
    <span class="text">
      <span class="label">{{ item.label }}</span>
      <span :if="item.description" class="description">{{ item.description }}</span>
    </span>
  </label>
</div>
