<script :setup="{ items = [], label = '', title = '', align = 'start', size = 'md', variant = 'secondary', disabled = false }">
  // A list of actions behind a button: what to do with a session, a file, a
  // row. It opens in the platform's top layer (`popover`), so no container
  // clips it and no z-index has to win.
  //
  // **Part of the default theme**: imports only the theme's own `Scrollable`,
  // which its list scrolls through, and draws only with `tokens.css`. See
  // `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Menu label="Session" :items="[
  //     { value: 'rename', label: 'Rename', hint: 'F2' },
  //     { value: 'copy', label: 'Copy as text' },
  //     '-',
  //     { value: 'delete', label: 'Delete', danger: true },
  //   ]" @select="act($event.detail)" />
  //
  // An item is a string, `'-'` for a separator, or `{ value, label, hint,
  // disabled, danger }`. Choosing one emits `select` with its value and
  // closes. The arrows, Home and End move inside it; ESC and a click outside
  // close it, which is the popover's own behaviour. `align` is `start` or
  // `end`, the trigger's edge the menu lines up with. The `trigger` slot
  // replaces the label, for an icon.

  const Scrollable = await import("./scrollable.html")

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)

  $: entries = items.map(i =>
    i === "-" ? { separator: true } : typeof i === "string" ? { value: i, label: i } : i)
  const id = `luu-menu-${Math.random().toString(36).slice(2, 9)}`
  let open = false

  // Under the trigger, or above it when there is no room below; inside the
  // window either way.
  const place = () => {
    const trigger = $self(".trigger")
    const list = $self(".list")
    if (!trigger || !list) return
    const t = trigger.getBoundingClientRect()
    const w = list.offsetWidth
    const h = list.offsetHeight
    const below = t.bottom + 4 + h <= window.innerHeight
    const top = below ? t.bottom + 4 : Math.max(4, t.top - 4 - h)
    let left = align === "end" ? t.right - w : t.left
    left = Math.min(Math.max(4, left), window.innerWidth - w - 4)
    list.style.top = `${top}px`
    list.style.left = `${left}px`
  }

  const usable = () => [...($self(".list")?.querySelectorAll("button:not(:disabled)") || [])]
  const toggled = event => {
    open = event.newState === "open"
    if (!open) return
    place()
    requestAnimationFrame(() => usable()[0]?.focus())
  }

  const pick = entry => {
    if (entry.disabled) return
    $self(".list")?.hidePopover()
    $self(".trigger")?.focus()
    $emit("select", entry.value)
  }

  const key = e => {
    const buttons = usable()
    const i = buttons.indexOf(document.activeElement)
    const next =
      e.key === "ArrowDown" ? buttons[(i + 1) % buttons.length] :
      e.key === "ArrowUp" ? buttons[(i - 1 + buttons.length) % buttons.length] :
      e.key === "Home" ? buttons[0] :
      e.key === "End" ? buttons[buttons.length - 1] :
      null
    if (!next) return
    e.preventDefault()
    next.focus()
  }

  await $mounted()
  const away = () => open && place()
  window.addEventListener("resize", away)
  window.addEventListener("scroll", away, true)
  $destroyed(() => {
    window.removeEventListener("resize", away)
    window.removeEventListener("scroll", away, true)
  })
</script>

<span class="menu">
  <button type="button"
          class="trigger"
          :class.sm="size === 'sm'"
          :class.ghost="variant === 'ghost'"
          :class.open="open"
          :popovertarget="id"
          :disabled="isDisabled"
          :title="title || null"
          aria-haspopup="menu"
          :aria-expanded="open ? 'true' : 'false'">
    <span :if="!$slots.trigger">{{ label }}</span>
    <slot.trigger />
    <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
  </button>
  <div class="list" :id="id" popover role="menu" :aria-label="label || null"
       @toggle="toggled($event)" @keydown="key($event)">
    <!-- The popover is the ground and the frame; the entries scroll inside
         it, capped at what the window has room for less the frame. -->
    <Scrollable y :max="`calc(min(24rem, 100vh - 8px) - 2 * var(--luu-border-width))`"><div class="entries">
    <!-- A wrapper per entry, because `:each` on a <template> draws nothing;
         `display: contents` keeps it out of the layout. -->
    <div :each="entry, i in entries" :key="i" class="entry" role="none">
      <hr :if="entry.separator" role="separator">
      <button :if="!entry.separator"
              type="button"
              role="menuitem"
              :class.danger="entry.danger"
              :disabled="entry.disabled"
              @click="pick(entry)">
        <span class="text">{{ entry.label }}</span>
        <span :if="entry.hint" class="hint">{{ entry.hint }}</span>
      </button>
    </div>
    </div></Scrollable>
  </div>
</span>

  .entry { display: contents; }
