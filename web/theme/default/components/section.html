<script :setup="{ id = '', title = '', level = 2, divided = false }">
  // A part of a page that can be linked to: `<section id>`, its title with a
  // `#` beside it that is the link to it, what it is about, and its content.
  // An `AnchorNav` lists sections like this one and marks the one being read.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-21.a-design-system-of-components.completed.md`.
  //
  //   <Section id="models" title="Models">
  //     <template :slot.lead>Where a session sends, and what it may ask.</template>
  //     <template :slot.actions><Button size="sm">+ provider</Button></template>
  //     …
  //   </Section>
  //
  // `level` is 2 or 3, the heading's. `divided` draws a line under it, for a
  // page of sections one after another. A link to it lands below a page's
  // sticky head when the page sets `--luu-anchor-offset` to that head's height.

  // A bare attribute (`<X divided>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDivided = flag(divided)
  $: small = Number(level) >= 3
</script>

<section class="section" :id="id || null" :class.divided="isDivided" :aria-labelledby="id ? `${id}-title` : null">
  <header class="head">
    <h2 :if="!small" class="title" :id="id ? `${id}-title` : null">
      {{ title }}<a :if="id" class="anchor" :href="`#${id}`" :aria-label="`Link to ${title}`">#</a>
    </h2>
    <h3 :if="small" class="title small" :id="id ? `${id}-title` : null">
      {{ title }}<a :if="id" class="anchor" :href="`#${id}`" :aria-label="`Link to ${title}`">#</a>
    </h3>
    <div :if="$slots.actions" class="actions"><slot.actions /></div>
  </header>
  <p :if="$slots.lead" class="lead"><slot.lead /></p>
  <div class="body"><slot></slot></div>
</section>
