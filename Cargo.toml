[workspace]
resolver = "3"
members = ["crates/agent-core", "crates/luu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jgermade/loude-ai"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
landlock = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seccompiler = "0.5"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tokio-tungstenite = "0.30"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "time"] }
toml = "1"
